<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מנתח רילסים</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --border: #e3e6ef;
      --text: #1d2233;
      --muted: #6b7289;
      --primary: #5b5bd6;
      --primary-hover: #4848b8;
      --danger: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12151f;
        --surface: #1b2030;
        --border: #2c3349;
        --text: #e8ebf5;
        --muted: #9aa3bd;
        --primary: #7c7cf0;
        --primary-hover: #9292f5;
        --danger: #ff6b5b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12151f;
      --surface: #1b2030;
      --border: #2c3349;
      --text: #e8ebf5;
      --muted: #9aa3bd;
      --primary: #7c7cf0;
      --primary-hover: #9292f5;
      --danger: #ff6b5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.7rem; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="url"] {
      flex: 1 1 260px;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      direction: ltr;
      text-align: left;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.9rem;
    }
    .status { color: var(--muted); min-height: 1.5em; margin-top: 12px; }
    .error { color: var(--danger); margin-top: 12px; }
    h2 { font-size: 1.1rem; margin: 0 0 10px; }
    ul { margin: 0; padding-right: 20px; }
    li { margin-bottom: 6px; }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-head h2 { margin: 0; }
    .transcript {
      white-space: pre-wrap;
      direction: rtl;
      max-height: 320px;
      overflow-y: auto;
      color: var(--muted);
      margin: 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>מנתח רילסים</h1>
  <p class="subtitle">הדבק קישור לריל מאינסטגרם וקבל תמלול, תקציר ונקודות מפתח בעברית.</p>

  <section class="card">
    <form id="analyzeForm">
      <input type="url" id="reelUrl" placeholder="https://www.instagram.com/reel/..." required>
      <button type="submit" id="submitBtn">נתח</button>
    </form>
    <div class="status" id="status"></div>
    <div class="error hidden" id="error"></div>
  </section>

  <section class="card hidden" id="summaryCard">
    <div class="card-head"><h2>תקציר</h2></div>
    <p id="summary" style="margin:0"></p>
  </section>

  <section class="card hidden" id="keyPointsCard">
    <div class="card-head"><h2>נקודות מרכזיות</h2></div>
    <ul id="keyPoints"></ul>
  </section>

  <section class="card hidden" id="takeawaysCard">
    <div class="card-head"><h2>מה כדאי להבין מהסרטון</h2></div>
    <ul id="takeaways"></ul>
  </section>

  <section class="card hidden" id="transcriptCard">
    <div class="card-head">
      <h2>תמלול מלא</h2>
      <button type="button" class="secondary" id="copyBtn">העתק</button>
    </div>
    <p class="transcript" id="transcript"></p>
  </section>
</main>

<script>
  const form = document.getElementById("analyzeForm");
  const input = document.getElementById("reelUrl");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const copyBtn = document.getElementById("copyBtn");

  function fillList(id, items) {
    const list = document.getElementById(id);
    list.replaceChildren(...items.map(text => {
      const li = document.createElement("li");
      li.textContent = text;
      return li;
    }));
    list.parentElement.classList.toggle("hidden", items.length === 0);
  }

  function showResult(data) {
    document.getElementById("summary").textContent = data.summary;
    document.getElementById("summaryCard").classList.toggle("hidden", !data.summary);
    fillList("keyPoints", data.keyPoints);
    fillList("takeaways", data.takeaways);
    document.getElementById("transcript").textContent = data.transcript || "(אין דיבור בסרטון)";
    document.getElementById("transcriptCard").classList.remove("hidden");
  }

  function clearResult() {
    ["summaryCard", "keyPointsCard", "takeawaysCard", "transcriptCard"].forEach(id =>
      document.getElementById(id).classList.add("hidden"));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    clearResult();
    submitBtn.disabled = true;
    statusEl.textContent = "מוריד, מתמלל ומנתח... זה יכול לקחת כחצי דקה";

    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: input.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || "משהו השתבש. נסה/י שוב.");
      }
      showResult(data);
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "";
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
    } finally {
      submitBtn.disabled = false;
    }
  });

  copyBtn.addEventListener("click", async () => {
    const text = document.getElementById("transcript").textContent;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "הועתק ✓";
      setTimeout(() => (copyBtn.textContent = "העתק"), 1500);
    } catch {
      copyBtn.textContent = "לא הצלחתי להעתיק";
    }
  });
</script>
</body>
</html>
