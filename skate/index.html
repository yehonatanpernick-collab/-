<title>Sundown Boulevard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,800;1,900&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-bleed cinematic WebGL scene; HUD floats on top; captions in two film-subtitle styles. Single committed dusk look. */
:root{
  --ink:#3a1230;
  --cream:#fff6ea;
  --gold:#ffc35a;
  --ember:#ff5a2e;
  --dusk:#160a12;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-impact:'Kanit','Arial Black','Helvetica Neue',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dusk);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--font-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.fx{position:fixed;inset:0;pointer-events:none}
#fade{background:var(--dusk);opacity:1;transition:opacity 1.4s ease}
#fade.off{opacity:0}
.outline{color:var(--cream);font-family:var(--font-display);letter-spacing:.01em;
  text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),
  0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -2px 0 var(--ink),0 6px 0 rgba(58,18,48,.85),0 10px 26px rgba(20,0,10,.5)}
.impact{color:#fff;font-family:var(--font-impact);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em;
  text-shadow:3px 4px 0 rgba(30,6,20,.55),0 0 30px rgba(255,120,60,.35)}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.stat{display:flex;flex-direction:column;gap:3px;min-width:74px}
.stat.right{align-items:flex-end;text-align:right}
.stat .k{font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,236,222,.88);text-shadow:0 1px 4px rgba(30,0,16,.7)}
.stat .v{font-size:24px;line-height:1}
.tok{display:flex;align-items:center;gap:7px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 45%,#c96d14);box-shadow:0 0 12px rgba(255,180,70,.95),0 0 0 2px var(--ink)}
.dist{text-align:center;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.dist small{font-size:20px;margin-left:3px}

#caption{position:fixed;left:0;right:0;top:22%;text-align:center;line-height:1.05;
  padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transform:translateY(10px) scale(.98);
  transition:opacity 1s ease,transform 1s ease;text-wrap:balance}
#caption.outline{font-size:clamp(28px,7.6vw,54px)}
#caption.impact{font-size:clamp(40px,min(14vw,15vh),110px);top:36%}
#caption.on{opacity:1;transform:none}
#pop{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:28px;pointer-events:none;opacity:0;transition:opacity .25s,transform .3s;transform:scale(.85)}
#pop.on{opacity:1;transform:none}
#pop .sub{display:block;font-size:16px;color:var(--gold)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8vh) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(22,4,14,0) 35%,rgba(22,4,14,.62) 100%);opacity:0;pointer-events:none;transition:opacity .8s}
.screen.on{opacity:1;pointer-events:auto}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.86;font-weight:900}
.logo .a{font-size:clamp(52px,15vw,120px)}
.logo .b{font-size:clamp(30px,8.4vw,66px);color:var(--gold);letter-spacing:.06em}
.screen h2{margin:0;font-size:clamp(40px,11vw,80px);line-height:1}
.tag{margin:0;max-width:32ch;font-weight:800;font-size:16px;line-height:1.45;color:rgba(255,242,230,.95);text-shadow:0 1px 8px rgba(30,0,16,.85)}
.btn{font-family:var(--font-impact);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;
  padding:14px 40px 15px;border-radius:999px;background:linear-gradient(180deg,#ff9248,var(--ember) 60%,#d83a22);
  box-shadow:0 5px 0 var(--ink),0 14px 34px rgba(255,80,30,.5);text-shadow:0 2px 0 rgba(58,18,48,.5);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),0 6px 18px rgba(255,80,30,.4)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;max-width:460px;font-weight:800;font-size:13px;color:rgba(255,238,226,.95);text-shadow:0 1px 5px rgba(30,0,16,.9)}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys b{display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;background:rgba(255,247,236,.16);border:1px solid rgba(255,247,236,.35);font-weight:900}
.stats{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .k{font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,236,222,.88)}
.stats .v{font-size:30px}
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,247,236,.35);background:rgba(40,10,30,.35);color:var(--cream);font:900 14px var(--font-body);cursor:pointer;backdrop-filter:blur(4px)}
#mute:focus-visible{outline:2px solid var(--cream)}
#err{position:fixed;left:16px;right:16px;bottom:30%;text-align:center;font-weight:800;color:var(--cream)}
@media (prefers-reduced-motion:reduce){#caption,#pop,.screen,#hud,#fade{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Sundown Boulevard game view"></canvas>

<div id="hud">
  <div class="stat"><span class="k">Tokens</span><span class="v outline tok"><i class="coin"></i><span id="tok">0</span></span></div>
  <div class="dist outline"><span id="dist">0</span><small id="unit">m</small></div>
  <div class="stat right"><span class="k">Best</span><span class="v outline" id="best">0 m</span></div>
</div>
<div id="caption"></div>
<div id="pop" class="outline"></div>

<section id="title" class="screen" aria-label="Start">
  <h1 class="logo impact"><span class="a">Sundown</span><span class="b">Boulevard</span></h1>
  <p class="tag">An endless golden-hour skate down a palm-lined street that never quite reaches the sea.</p>
  <button class="btn" id="play">Start rolling</button>
  <div class="keys" id="keys"></div>
</section>

<section id="over" class="screen" aria-label="Run summary">
  <h2 class="impact" id="overTitle">Wiped out</h2>
  <div class="stats">
    <div><span class="k">Distance</span><span class="v outline" id="oDist">0 m</span></div>
    <div><span class="k">Tokens</span><span class="v outline" id="oTok">0</span></div>
    <div><span class="k">Best</span><span class="v outline" id="oBest">0 m</span></div>
  </div>
  <button class="btn" id="again">Roll again</button>
</section>
<button id="mute" aria-label="Toggle sound">♪</button>
<div id="fade" class="fx"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hsh=(s,k)=>{const x=Math.sin(s*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;

/* =========================================================
   Renderer, post-processing, atmosphere
   ========================================================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false});
let PR=Math.min(window.devicePixelRatio||1,isTouch?1.5:1.75);
renderer.setPixelRatio(PR);
// hue-preserving filmic curve (keeps sunset reds saturated instead of bleaching them like ACES)
THREE.ShaderChunk.tonemapping_pars_fragment=THREE.ShaderChunk.tonemapping_pars_fragment.replace(/vec3 ReinhardToneMapping\( vec3 color \) \{[\s\S]*?\n\}/,`vec3 ReinhardToneMapping( vec3 color ) {
  color *= toneMappingExposure;
  vec3 pc = 1.0 - exp( -color );
  float m = max( max( color.r, color.g ), color.b );
  vec3 hp = color * ( ( 1.0 - exp( -m ) ) / max( m, 1e-5 ) );
  vec3 c = mix( pc, hp, 0.55 );
  float w = smoothstep( 2.5, 14.0, m );
  return saturate( mix( c, vec3( 1.0 ), w * 0.8 ) );
}`);
renderer.toneMapping=THREE.ReinhardToneMapping;
renderer.toneMappingExposure=1.55;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.3,6000);
const SUN=new V3(-0.2,0.15,-1).normalize();
const MAXANISO=renderer.capabilities.getMaxAnisotropy();
const BEHIND=25, RANGE=390, COAST=362;

// Atmospheric haze: fog that glows gold toward the sun and burns red away from it
const HAZE={hazeRes:{value:new THREE.Vector2(1,1)},hazeSun:{value:new THREE.Vector2(0.3,0.9)},hazeSunCol:{value:new THREE.Color().setRGB(0.55,0.22,0.04)}};
THREE.ShaderChunk.fog_pars_fragment=`#ifdef USE_FOG
uniform vec3 fogColor;varying float vFogDepth;uniform float fogNear;uniform float fogFar;
uniform vec2 hazeRes;uniform vec2 hazeSun;uniform vec3 hazeSunCol;
#endif`;
THREE.ShaderChunk.fog_fragment=`#ifdef USE_FOG
float fogFactor=smoothstep(fogNear,fogFar,vFogDepth);
vec2 sp=gl_FragCoord.xy/max(hazeRes,vec2(1.))-hazeSun;sp.x*=hazeRes.x/max(hazeRes.y,1.);
float sunAmt=exp(-dot(sp,sp)*10.);
gl_FragColor.rgb=mix(gl_FragColor.rgb,fogColor+hazeSunCol*sunAmt,fogFactor*fogFactor*(3.-2.*fogFactor));
#endif`;
scene.fog=new THREE.Fog(new THREE.Color().setRGB(0.95,0.22,0.07),70,820);
function haze(m){m.onBeforeCompile=s=>{Object.assign(s.uniforms,HAZE);};return m;}

const hemi=new THREE.HemisphereLight(new THREE.Color().setRGB(1.0,0.35,0.18),new THREE.Color().setRGB(0.22,0.06,0.08),0.3);
scene.add(hemi);
const sun=new THREE.DirectionalLight(new THREE.Color().setRGB(1.0,0.48,0.18),7.0);
sun.castShadow=true;
const SHADOW=isTouch?2048:3072;
sun.shadow.mapSize.set(SHADOW,SHADOW);
const SC=sun.shadow.camera;SC.left=-40;SC.right=40;SC.top=40;SC.bottom=-40;SC.near=1;SC.far=1000;
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.04;
scene.add(sun,sun.target);
const LZ=SUN.clone(),LX=new V3().crossVectors(new V3(0,1,0),LZ).normalize(),LY=new V3().crossVectors(LZ,LX);
const TX=80/SHADOW,TY=80/SHADOW;
function placeSun(pz){
  const T=new V3(0,0,pz-115);
  let a=T.dot(LX),b=T.dot(LY);const c=T.dot(LZ);
  a=Math.round(a/TX)*TX;b=Math.round(b/TY)*TY;
  T.copy(LX).multiplyScalar(a).addScaledVector(LY,b).addScaledVector(LZ,c);
  sun.target.position.copy(T);sun.position.copy(T).addScaledVector(SUN,450);
}

/* ---------- sky ---------- */
const NOISE=`
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*vn(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}`;
const HORIZON=`vec3 horizonCol(vec3 d,vec3 s){float az=max(dot(normalize(vec3(d.x,0.,d.z)),normalize(vec3(s.x,0.,s.z))),0.);
  return mix(vec3(0.95,0.20,0.06),vec3(1.9,0.62,0.14),pow(az,7.));}`;
const skyMat=new THREE.ShaderMaterial({
  uniforms:{sunDir:{value:SUN},time:{value:0}},side:THREE.BackSide,depthWrite:false,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
  fragmentShader:`uniform vec3 sunDir;uniform float time;varying vec3 vDir;${NOISE}${HORIZON}
  void main(){
    vec3 d=normalize(vDir);float h=d.y;float cs=dot(d,sunDir);float sd=max(cs,0.);
    vec3 hz=horizonCol(d,sunDir);
    float t=max(h,0.);
    vec3 col=mix(hz,vec3(1.1,0.2,0.04),smoothstep(0.0,0.13,t));
    col=mix(col,vec3(0.7,0.08,0.03),smoothstep(0.10,0.40,t));
    col=mix(col,vec3(0.22,0.02,0.04),smoothstep(0.38,1.0,t));
    col+=vec3(1.6,0.5,0.1)*pow(sd,9.)*0.8+vec3(2.5,1.1,0.3)*pow(sd,70.);
    // two cloud layers, stretched into evening streaks
    vec2 uv=d.xz/max(h+0.055,0.03);
    vec2 u1=vec2(uv.x*0.36,uv.y)*0.22+vec2(time*0.0035,time*0.001);
    float n=fbm(u1+vec2(fbm(u1*0.7+3.1),fbm(u1*0.7+7.3))*0.9);
    float cover=smoothstep(0.41,0.68,n)*smoothstep(0.012,0.08,h);
    float lit=pow(sd,2.5);
    float thin=1.-smoothstep(0.41,0.56,n);
    vec3 cc=mix(vec3(0.55,0.05,0.03),vec3(1.5,0.3,0.06),0.35+0.65*lit);
    cc+=thin*vec3(2.0,0.65,0.15)*(0.35+1.6*pow(sd,4.));
    cc*=mix(1.0,0.6,smoothstep(0.3,0.85,h));
    col=mix(col,cc,cover*0.93);
    vec2 u2=vec2(uv.x*0.25,uv.y*1.4)*0.5+vec2(time*0.006,0.);
    float n2=fbm(u2*1.3+11.);
    float c2=smoothstep(0.55,0.8,n2)*smoothstep(0.004,0.05,h)*(1.-smoothstep(0.08,0.25,h));
    col=mix(col,mix(vec3(0.7,0.12,0.04),vec3(2.0,0.8,0.25),pow(sd,3.)),c2*0.55);
    // sun disc
    float disc=smoothstep(0.99620,0.99700,cs);
    col=mix(col,vec3(30.,18.,7.),disc*(1.-cover*0.45));
    col+=vec3(4.,2.2,0.8)*pow(sd,700.);
    if(h<0.)col=hz*0.85;
    gl_FragColor=vec4(col,1.);
  }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,48,32),skyMat);
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);

// image-based lighting from the sunset sky
{
  const pm=new THREE.PMREMGenerator(renderer);
  const envScene=new THREE.Scene();
  const envSky=new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMat);envScene.add(envSky);
  const ground=new THREE.Mesh(new THREE.CircleGeometry(90,24),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(0.25,0.08,0.06)}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-3;envScene.add(ground);
  scene.environment=pm.fromScene(envScene,0.02).texture;
  pm.dispose();
}

/* ---------- ocean ---------- */
const oceanMat=new THREE.ShaderMaterial({
  uniforms:{sunDir:{value:SUN},time:{value:0}},
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform vec3 sunDir;uniform float time;varying vec3 vW;${HORIZON}${NOISE}
  void main(){
    vec3 vd=vW-cameraPosition;float dist=length(vd);vd/=dist;
    vec2 p=vW.xz;
    float az=max(dot(normalize(vd.xz),normalize(sunDir.xz)),0.);
    float sw=sin(p.x*0.9+time*1.4+sin(p.y*0.3))*sin(p.y*0.55-time*1.1)*sin((p.x*0.45+p.y*0.35)*1.7+time*0.9);
    float sp=smoothstep(0.25,0.9,sw)*(0.6+0.8*vn(p*0.08+time*0.1));
    float swell=sin(p.y*0.14+time*0.7)*0.5+0.5;
    vec3 deep=mix(vec3(0.07,0.05,0.22),vec3(0.13,0.07,0.3),swell*0.6);
    float fres=pow(1.-abs(vd.y),5.);
    vec3 refl=horizonCol(vd,sunDir)*0.55;
    vec3 col=mix(deep,refl,fres*0.55);
    float column=pow(az,700.);float broad=pow(az,60.);
    col+=vec3(4.5,2.3,0.8)*column*(0.25+2.2*sp)+vec3(1.6,0.6,0.2)*broad*(0.15+0.7*sp);
    col=mix(col,horizonCol(vd,sunDir)*0.8,smoothstep(900.,3400.,dist)*0.5);
    gl_FragColor=vec4(col,1.);
  }`
});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(7000,3400),oceanMat);
ocean.rotation.x=-Math.PI/2;ocean.frustumCulled=false;scene.add(ocean);

/* ---------- post-processing ---------- */
const rt=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),0.3,0.4,2.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0},res:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform vec2 res;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){
    vec3 c=texture2D(tDiffuse,vUv).rgb;
    float l=dot(c,vec3(0.299,0.587,0.114));
    c*=mix(vec3(1.0),vec3(1.06,0.94,0.88),0.8);
    c+=vec3(0.10,0.015,0.05)*(1.-smoothstep(0.0,0.45,l))*0.55;
    c=mix(vec3(l),c,1.2);
    c=(c-0.5)*1.05+0.5;
    vec2 q=vUv-0.5;q.y*=1.15;
    c*=mix(0.58,1.0,smoothstep(0.82,0.22,length(q)));
    c+=(h(vUv*res+fract(time)*61.)-0.5)*0.03;
    gl_FragColor=vec4(clamp(c,0.,1.),1.);
  }`
});
composer.addPass(grade);

/* =========================================================
   Geometry helpers
   ========================================================= */
const _o=new THREE.Object3D();
function M(x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){_o.position.set(x,y,z);_o.rotation.set(rx,ry,rz);_o.scale.set(sx,sy,sz);_o.updateMatrix();return _o.matrix.clone();}
// merge parts into one geometry with vertex colours, uvs and material groups
function merge(parts,nMat=1){
  const B=Array.from({length:nMat},()=>({p:[],n:[],u:[],c:[]}));const col=new THREE.Color();
  for(const pt of parts){
    let g=pt.geo.index?pt.geo.toNonIndexed():pt.geo.clone();
    if(pt.m)g.applyMatrix4(pt.m);
    if(!g.attributes.normal)g.computeVertexNormals();
    const P=g.attributes.position.array,N=g.attributes.normal.array,U=g.attributes.uv?g.attributes.uv.array:null;
    const b=B[pt.mi||0];col.set(pt.color);const su=pt.uv?pt.uv[0]:1,sv=pt.uv?pt.uv[1]:1;
    for(let i=0;i<P.length;i++){b.p.push(P[i]);b.n.push(N[i]);}
    const vc=P.length/3;

  }

function polyGeo(polys,tw=1,th=1){
  const pos=[],uv=[];

    let P=pts;
    let nn=new V3().subVectors(P[1],P[0]).cross(new V3().subVectors(P[2],P[0]));
    if(nn.dot(out)<0){P=[...P].reverse();nn=new V3().subVectors(P[1],P[0]).cross(new V3().subVectors(P[2],P[0]));}

const strips=[];
const dummy=new THREE.Object3D(),tmpCol=new THREE.Color();
class Strip{
  constructor(parts,count,spacing,offset,place,opt={}){
    this.meshes=parts.map(p=>{const m=new THREE.InstancedMesh(p.geo,p.mat,count);m.frustumCulled=false;m.castShadow=p.cast!==false;m.receiveShadow=true;
      if(p.depth)m.customDepthMaterial=p.depth;scene.add(m);return m;});
    this.count=count;this.spacing=spacing;this.place=place;this.tint=!!opt.tint;
    this.zs=new Float32Array(count);this.seeds=new Float32Array(count);
    for(let i=0;i<count;i++){this.zs[i]=BEHIND-offset-i*spacing;this.seeds[i]=Math.random();this.put(i);}
    strips.push(this);
  }
  put(i){dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);tmpCol.setRGB(1,1,1);
    this.place(dummy,this.zs[i],this.seeds[i],tmpCol);dummy.updateMatrix();
    for(const m of this.meshes){m.setMatrixAt(i,dummy.matrix);if(this.tint)m.setColorAt(i,tmpCol);}}
  flush(){for(const m of this.meshes){m.instanceMatrix.needsUpdate=true;if(this.tint&&m.instanceColor)m.instanceColor.needsUpdate=true;}}
  update(pz){let ch=false;const span=this.count*this.spacing;
    for(let i=0;i<this.count;i++)if(this.zs[i]>pz+BEHIND){this.zs[i]-=span;this.seeds[i]=Math.random();this.put(i);ch=true;}
    if(ch)this.flush();}
  shift(dz){for(let i=0;i<this.count;i++){this.zs[i]+=dz;this.put(i);}this.flush();}
}

function addRamp(x,z){const r=ramps.find(r=>!r.active);if(!r)return false;r.active=true;r.x=x;r.z=z;r.m.position.set(x,0,z);r.m.visible=true;return true;}
const LANES=[-2.4,0,2.4];
function spawnPatterns(){
  while(spawnZ>P.z-300){
    const z=spawnZ,r=Math.random(),lx=LANES[(Math.random()*3)|0];
    if(r<0.24){for(let k=0;k<6;k++)addTok(lx,0.9,z-k*3.2);}
    else if(r<0.44){const cx=clamp(lx+rand(-0.5,0.5),-3.4,3.4);addCone(cx,z-10);for(let k=0;k<5;k++)addTok(cx,0.9+1.6*Math.sin(Math.PI*k/4),z-4-k*3.2);}
    else if(r<0.62){const ph=Math.random()*6;for(let k=0;k<9;k++)addTok(2.3*Math.sin(ph+k*0.6),0.9,z-k*3);}
    else if(r<0.82){const rx=rand(-0.8,0.8);if(addRamp(rx,z-6)){for(let k=0;k<7;k++)addTok(rx,1.6+2.4*Math.sin(Math.PI*(k+1)/8),z-10-k*2.6);}}
    else{const cx=rand(-2.6,2.6);addCone(cx-0.65,z-8);addCone(cx+0.65,z-8);for(let k=0;k<3;k++)addTok(cx,1.7+0.8*Math.sin(Math.PI*k/2),z-5-k*3);}
    spawnZ-=rand(34,58);
  }
}
function carCap(){if(mode==='title')return{on:2,same:1};return{on:Math.min(3,1+Math.floor(runDist/350)),same:Math.min(2,1+Math.floor(runDist/600))};}
function spawnCar(c){
  const cap=carCap(),activeSame=cars.filter(o=>o.active&&o.lane===c.lane).length;
  if(activeSame>=(c.lane<0?cap.on:cap.same)){c.wait=rand(1,3);return;}
  let z;
  if(c.lane<0){z=P.z-COAST+rand(5,40);if(cars.some(o=>o.active&&o.lane<0&&Math.abs(o.z-z)<60)){c.wait=rand(0.5,2);return;}c.cruise=rand(8,12);}
  else{z=P.z+BEHIND+6;if(cars.some(o=>o.active&&o.lane>0&&Math.abs(o.z-z)<30)){c.wait=rand(1,3);return;}c.cruise=Math.max(P.v+rand(4,7),13);}
  c.z=z;c.v=c.cruise;c.active=true;c.honked=false;c.jumped=false;c.g.visible=true;c.paint.color.setHex(PAINTS[(Math.random()*PAINTS.length)|0]);
  c.g.rotation.y=c.lane<0?Math.PI:0;
}
function updateCars(dt){
  for(const c of cars){
    if(!c.active){c.wait-=dt;if(c.wait<=0)spawnCar(c);continue;}
    if(c.lane>0){
      const gap=c.z-P.z,inLane=Math.abs(P.x-c.x)<1.5&&P.y<1.2;
      if(inLane&&gap>2.8&&gap<14&&P.state==='ride'){c.v=Math.max(0,Math.min(c.v,P.v-(14-gap)*0.4));if(!c.honked&&gap<11){c.honked=true;AU.horn();}}
      else c.v=Math.min(c.cruise,c.v+4*dt);
      c.z-=c.v*dt;
    }else c.z+=c.v*dt;
    c.g.position.set(c.x,0,c.z);
    const g=Math.pow(Math.max(0,Math.sin(time*1.1+c.seed)),10);
    c.glint.material.opacity=(c.lane<0?0.3:0.12)+g*0.9;const s=2.2+g*3.8;c.glint.scale.set(s,s,1);
    if(c.z>P.z+BEHIND+12||c.z<P.z-COAST-40){c.active=false;c.g.visible=false;c.wait=rand(0.5,3.5);}
  }
}

function ollie(flip){if(P.state!=='ride'||P.air)return;P.air=true;P.vy=9.4;P.ollieT=0;P.flip=!!flip;P.flipA=0;P.cv-=2.8;P.pushT=-1;P.big=false;P.onRamp=null;AU.pop();}
function crash(){if(P.state!=='ride')return;P.state='crash';P.crashT=0;AU.crash();mode='crash';shake=0.6;}
function resetRider(){rider.rotation.set(0,0,0);rider.position.set(0,0,0);board.position.set(0,0.1,0);board.rotation.set(0,0,0);P.state='ride';P.y=0;P.vy=0;P.air=false;P.pushT=-1;P.crouch=0.25;P.cv=0;P.onRamp=null;P.pitch=0;}
const G=20;
function updatePlayer(dt){
  if(P.state==='ride'){
    const target=(mode==='title'?9:Math.min(17,10.5+runDist/450))*(P.brake>0||brakeKey?0.55:1);
    P.brake=Math.max(0,P.brake-dt);
    if(!P.air&&!P.onRamp&&P.pushT<0&&P.v<target-0.5)P.pushT=0;
    if(P.pushT>=0){P.pushT+=dt/0.82;if(P.pushT>0.22&&P.pushT<0.75)P.v+=5.2*dt;if(P.pushT>=1)P.pushT=-1;}
    P.v-=(P.v>target+0.3?3.5:0.28)*dt;P.v=Math.max(P.v,2.5);
    if(mode==='title'){P.tx=Math.sin(time*0.23)*0.9;autoHop-=dt;if(autoHop<0){ollie(Math.random()<0.4);autoHop=rand(3,6);}}
    else P.tx=clamp(P.tx+steerKey*7.5*dt,-3.9,3.9);
    const nx=P.x+(P.tx-P.x)*(1-Math.exp(-7*dt));P.xv=dt>0?(nx-P.x)/dt:0;P.x=nx;
    P.yaw=lerp(P.yaw,clamp(-P.xv*0.05,-0.4,0.4),1-Math.exp(-10*dt));
    P.lean=lerp(P.lean,clamp(-P.xv*0.06,-0.35,0.35),1-Math.exp(-8*dt));
    P.z-=P.v*dt;
    if(!P.air){
      let on=null;
      for(const r of ramps){if(!r.active)continue;const prog=(r.z+RAMP_L/2-P.z)/RAMP_L;
        if(Math.abs(P.x-r.x)<RAMP_W/2+0.1&&prog>=0&&prog<=1.05){
          if(prog>=1){P.air=true;P.vy=6.5+P.v*0.32;P.ollieT=0.2;P.flip=false;P.big=true;on=null;AU.pop();if(mode==='play')pop('Big air');break;}
          on=r;const t=clamp(prog,0,1);P.y=RAMP_H*(t*t*0.45+t*0.55);P.pitch=Math.atan(RAMP_H/RAMP_L)*(0.6+0.8*t);}}
      if(P.onRamp&&!on&&!P.air){P.y=0;P.pitch=0;}
      P.onRamp=on;
    }
    if(P.air){P.ollieT+=dt;P.vy-=G*dt;P.y+=P.vy*dt;
      const t=P.ollieT;if(!P.big)P.pitch=t<0.1?0.5*(t/0.1):0.5*Math.max(0,1-(t-0.1)/0.22);else P.pitch=lerp(P.pitch,0,1-Math.exp(-4*dt));
      if(P.flip){const f=clamp((t-0.04)/0.45,0,1);P.flipA=(1-Math.pow(1-f,2.2))*Math.PI*2;}
      if(P.y<=0)land(0);}
    const ct=P.air?(P.ollieT<0.08?0.0:(P.big?0.95:0.8)):0.25+(P.pushT>=0?0.32:0)+(P.brake>0||brakeKey?0.2:0)+(P.onRamp?0.3:0);
    P.cv+=(ct-P.crouch)*90*dt-P.cv*13*dt;P.crouch+=P.cv*dt;
    if(mode==='play')runDist+=P.v*dt;
  }else{
    P.crashT+=dt;P.v=Math.max(0,P.v-14*dt);P.z-=P.v*dt;
    const f=Math.min(1,P.crashT*2.4);
    rider.rotation.z=f*1.45;rider.rotation.y=f*0.6;rider.position.y=-f*0.35+Math.abs(Math.sin(P.crashT*9))*0.2*(1-f);rider.position.x=-f*0.4;
    board.position.x+=dt*3*(1-f*0.5);board.rotation.y+=dt*8*(1-f*0.8);board.rotation.z=Math.min(Math.PI,board.rotation.z+dt*10);
    if(P.air||P.y>0){P.vy-=G*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.air=false;}
    if(P.crashT>1.7&&mode==='crash')gameOver();
  }
  root.position.set(P.x,P.y,P.z);root.rotation.y=P.yaw;leanG.rotation.z=P.lean;
  if(P.state==='ride')board.rotation.set(P.pitch,0,P.flipA);
  pose();
}
function land(h){
  P.y=h;P.air=false;P.cv-=3.4;P.pitch=0;AU.land();
  if(mode==='play'&&P.flip){if(P.flipA>Math.PI*1.75){runTok+=1;pop('Kickflip','+1 token');AU.trick();}else pop('Sketchy!');}
  P.flip=false;P.flipA=0;P.big=false;
}
function pose(){
  const c=clamp(P.crouch,-0.25,1.15),V=Pv;const deck=0.17;
  const sway=Math.sin(time*1.6)*0.03;
  V.H.set(-0.03-0.05*c,0.98-0.36*c,P.pushT>=0?-0.07:0);
  V.HF.copy(V.H).add(_a.set(0,-0.02,-0.09));V.HB.copy(V.H).add(_a.set(0,-0.02,0.09));
  let lift=0;if(P.air&&P.flip)lift=Math.sin(clamp(P.ollieT/0.5,0,1)*Math.PI)*0.3;
  V.FF.set(0,deck+0.08+lift+P.pitch*0.2,-0.24);V.FB.set(0,deck+0.08+lift*0.7-P.pitch*0.05,0.25);
  if(P.pushT>=0){const p=P.pushT;let fx=0.25,fy,fz;
    if(p<0.22){const t=p/0.22;fx=lerp(0,0.25,t);fy=lerp(deck+0.08,0.13,t)+Math.sin(t*Math.PI)*0.1;fz=lerp(0.25,-0.05,t);}
    else if(p<0.75){const t=(p-0.22)/0.53;fy=0.13;fz=lerp(-0.05,0.8,t);}
    else{const t=(p-0.75)/0.25;fx=lerp(0.25,0,t);fy=lerp(0.13,deck+0.08,t)+Math.sin(t*Math.PI)*0.16;fz=lerp(0.8,0.25,t);}
    V.FB.set(fx,fy,fz);}
  ik(V.HF,V.FF,LT,LS,poleLF,V.kF,V.aF);ik(V.HB,V.FB,LT,LS,poleLB,V.kB,V.aB);
  seg(body.thighF,V.HF,V.kF);seg(body.shinF,V.kF,V.aF);seg(body.thighB,V.HB,V.kB);seg(body.shinB,V.kB,V.aB);
  for(const [sk,a,k] of[[body.sockF,V.aF,V.kF],[body.sockB,V.aB,V.kB]]){_b.subVectors(k,a).normalize();sk.position.copy(a).addScaledVector(_b,0.06);sk.quaternion.setFromUnitVectors(UP,_b);}
  body.shoeF.position.copy(V.aF).add(_a.set(0.03,-0.045,0));body.shoeB.position.copy(V.aB).add(_a.set(0.03,-0.045,0));
  body.shoeF.rotation.z=-P.pitch*0.5;body.shoeB.rotation.z=-P.pitch*0.5;
  body.pelvis.position.copy(V.H);
  V.Ch.copy(V.H).add(_a.set(0.1+0.22*c+(P.pushT>=0?0.08:0),0.5-0.1*c,0));
  segS(body.torso,_b.copy(V.H).add(_a.set(0,0.02,0)),V.Ch);
  const nk=_c.copy(V.Ch).add(_a.set(0.03,0.04,0));seg(body.neck,V.Ch,nk);
  body.head.position.copy(V.Ch).add(_a.set(0.05+0.04*c,0.2,-0.01));body.head.rotation.set(0,0,-0.15*c);
  V.SF.copy(V.Ch).add(_a.set(0,-0.06,-0.19));V.SB.copy(V.Ch).add(_a.set(0,-0.06,0.19));
  const out=0.35+(P.air?0.6:0)+Math.abs(P.lean)*1.2;
  V.hF.copy(V.SF).add(_a.set(0.14,-0.4+0.18*out,-0.1-0.24*out+sway));
  V.hB.copy(V.SB).add(_a.set(-0.02,-0.4+0.16*out,0.1+0.24*out-sway));
  ik(V.SF,V.hF,LU,LF,poleAF,V.eF,V.wF);ik(V.SB,V.hB,LU,LF,poleAB,V.eB,V.wB);
  seg(body.upF,V.SF,V.eF);seg(body.loF,V.eF,V.wF);seg(body.upB,V.SB,V.eB);seg(body.loB,V.eB,V.wB);
  seg(body.sleeveF,V.SF,V.eF);seg(body.sleeveB,V.SB,V.eB);
  body.handF.position.copy(V.wF);body.handB.position.copy(V.wB);
}

/* ---------- collisions / pickups ---------- */
let coinStreak=0,streakT=0,prevY=0;
function updateItems(dt){
  streakT-=dt;if(streakT<0)coinStreak=0;
  const cy=P.y+0.9;
  for(let i=0;i<TOK;i++){const t=tokens[i];
    if(t.active){
      if(t.z>P.z+3)t.active=false;
      else if(mode==='play'&&P.state==='ride'){const dx=t.x-P.x,dy=t.y-cy,dz=t.z-P.z;if(dx*dx+dy*dy*0.6+dz*dz<1.15){t.active=false;runTok++;AU.coin(coinStreak++);streakT=0.8;}}
    }
    if(t.active){dummy.position.set(t.x,t.y+Math.sin(time*2.5+i)*0.08,t.z);dummy.rotation.set(0,time*3+i,0);dummy.scale.set(1,1,1);
      tokGlowPos[i*3]=t.x;tokGlowPos[i*3+1]=dummy.position.y;tokGlowPos[i*3+2]=t.z;}
    else{dummy.position.set(0,-50,0);dummy.rotation.set(0,0,0);dummy.scale.set(0.001,0.001,0.001);tokGlowPos[i*3+1]=-50;}
    dummy.updateMatrix();tokMesh.setMatrixAt(i,dummy.matrix);
  }
  tokMesh.instanceMatrix.needsUpdate=true;tokGlow.geometry.attributes.position.needsUpdate=true;
  for(const c of cones){if(!c.active)continue;const m=c.m;
    if(c.hit){c.vy-=20*dt;m.position.x+=c.vx*dt;m.position.y=Math.max(0,m.position.y+c.vy*dt);m.position.z+=c.vz*dt;m.rotation.x+=dt*9;m.rotation.z+=dt*5;}
    else if(P.state==='ride'){const dx=Math.abs(m.position.x-P.x),dz=Math.abs(m.position.z-P.z);
      if(dx<0.42&&dz<0.38){if(P.y<0.55){c.hit=true;c.vx=(m.position.x-P.x)*6+rand(-2,2);c.vy=5;c.vz=-P.v*0.9;AU.bonk();if(mode==='play'){P.v*=0.72;pop('Bonk');}}}
      else if(!c.cleared&&dx<0.6&&m.position.z>P.z+0.4&&P.air){c.cleared=true;if(mode==='play'){runTok++;pop('Clean ollie','+1 token');AU.trick();}}}
    if(m.position.z>P.z+20){c.active=false;m.visible=false;}}
  for(const r of ramps)if(r.active&&r.z>P.z+20){r.active=false;r.m.visible=false;}
  // cars: bounce off the roof, sail over them, or wipe out
  if(P.state==='ride'){
    for(const c of cars){if(!c.active)continue;
      const dx=Math.abs(c.x-P.x),dz=P.z-c.z;
      if(dx<1.15){const top=carTop(c,dz);
        if(top>0){
          if(P.air&&P.vy<0&&P.y<=top+0.05&&prevY>top-0.35){
            P.y=top;P.vy=8.6;P.ollieT=0.15;P.big=true;P.flip=false;P.flipA=0;c.jumped=true;AU.boing();
            if(mode==='play'){runTok+=2;pop('Car hop','+2 tokens');}
          }else if(P.y<top-0.3&&mode==='play'&&P.inv<=0){crash();break;}
        }
      }
      if(!c.jumped&&dx<1.2&&P.air&&P.y>1.0&&Math.abs(c.z-P.z)<0.6){c.jumped=true;if(mode==='play'){runTok+=3;pop('Car jump','+3 tokens');AU.trick();}}
    }
  }
  prevY=P.y;
}

/* ---------- world rebase (keeps float precision on endless runs) ---------- */
const SHIFT=3200;
const camLook=new V3(0,0,-20);
function rebase(){
  P.z+=SHIFT;spawnZ+=SHIFT;camera.position.z+=SHIFT;camLook.z+=SHIFT;
  strips.forEach(s=>s.shift(SHIFT));cars.forEach(c=>c.z+=SHIFT);cones.forEach(c=>c.m.position.z+=SHIFT);tokens.forEach(t=>t.z+=SHIFT);
  ramps.forEach(r=>{r.z+=SHIFT;r.m.position.z=r.z;});
}

/* ---------- camera ---------- */
let shake=0;
function updateCamera(dt){
  const portrait=innerHeight>innerWidth;
  const k=1-Math.exp(-2.6*dt);
  const tx=P.x*0.5+Math.sin(time*0.31)*0.4,ty=(portrait?11:8.5)+P.y*0.35+Math.sin(time*0.23)*0.18;
  camera.position.x=lerp(camera.position.x,tx,k);camera.position.y=lerp(camera.position.y,ty,k);camera.position.z=P.z+(portrait?15:12.5);
  camLook.set(lerp(camLook.x,P.x*0.7,k),portrait?1.6:2.2,P.z-(portrait?20:30));
  camera.lookAt(camLook);
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*0.5;camera.position.y+=(Math.random()-.5)*shake*0.5;}
}
const sunScreen=new V3();
function updateHaze(){sunScreen.copy(SUN).multiplyScalar(1000).add(camera.position).project(camera);HAZE.hazeSun.value.set((sunScreen.x+1)/2,(sunScreen.y+1)/2);}

/* ---------- flow ---------- */
function startRun(){
  AU.init();
  $('title').classList.remove('on');$('over').classList.remove('on');$('hud').classList.add('on');
  resetRider();
  runDist=0;runTok=0;P.v=Math.max(P.v,8);P.inv=2.5;P.tx=0;P.brake=0;
  cars.forEach(c=>{if(c.active&&Math.abs(c.z-P.z)<120){c.active=false;c.g.visible=false;c.wait=rand(1,4);}});
  tokens.forEach(t=>t.active=false);cones.forEach(c=>{c.active=false;c.m.visible=false;});ramps.forEach(r=>{r.active=false;r.m.visible=false;});
  spawnZ=P.z-45;mode='play';captionIdx=0;nextCaption=450;
  setTimeout(()=>{if(mode==='play')caption(CAPTIONS[0],3);},400);
  canvas.focus({preventScroll:true});
}
function gameOver(){
  mode='over';
  const isBest=runDist>best;if(isBest){best=runDist;store.set('sundown-best',String(Math.floor(best)));}
  $('overTitle').textContent=isBest&&runDist>50?'New best':'Wiped out';
  $('oDist').textContent=fmt(runDist);$('oTok').textContent=runTok;$('oBest').textContent=fmt(best);$('best').textContent=fmt(best);
  $('over').classList.add('on');$('hud').classList.remove('on');
  setTimeout(()=>$('again').focus({preventScroll:true}),400);
}
$('play').addEventListener('click',e=>{e.stopPropagation();startRun();});
$('again').addEventListener('click',e=>{e.stopPropagation();startRun();});
$('mute').addEventListener('click',e=>{e.stopPropagation();AU.init();AU.setMute(!AU.muted);$('mute').textContent=AU.muted?'✕':'♪';});

/* ---------- input ---------- */
let ptr=null;
const isUI=t=>t&&t.closest&&t.closest('button');
window.addEventListener('pointerdown',e=>{if(isUI(e.target))return;AU.init();if(mode!=='play')return;ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),moved:0};});
window.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.x;ptr.moved+=Math.abs(dx)+Math.abs(e.clientY-ptr.y);ptr.x=e.clientX;ptr.y=e.clientY;
  if(Math.abs(e.clientX-ptr.x0)>8)P.tx=clamp(P.tx+dx*(9/(Math.min(innerWidth,720)*0.8)),-3.9,3.9);});
function endPtr(e){if(!ptr||e.pointerId!==ptr.id)return;const dt=performance.now()-ptr.t,dx=e.clientX-ptr.x0,dy=e.clientY-ptr.y0;
  if(dt<420&&dy<-40&&Math.abs(dy)>Math.abs(dx)*1.2)ollie(true);
  else if(dt<420&&dy>45&&Math.abs(dy)>Math.abs(dx)*1.2)P.brake=1.4;
  else if(dt<300&&ptr.moved<14)ollie(false);
  ptr=null;}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',()=>{ptr=null;});
const keys={};
function updSteer(){steerKey=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);brakeKey=!!(keys['s']||keys['arrowdown']);}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(keys[k]&&k!==' ')return;keys[k]=true;
  if(k==='m'){AU.init();AU.setMute(!AU.muted);$('mute').textContent=AU.muted?'✕':'♪';return;}
  if(mode==='title'||mode==='over'){if(k==='enter'||(k===' '&&!isUI(document.activeElement))){e.preventDefault();startRun();}return;}
  if(mode!=='play')return;
  if(k===' '){e.preventDefault();ollie(false);}
  if(k==='w'||k==='arrowup'){e.preventDefault();ollie(true);}
  if(k.startsWith('arrow'))e.preventDefault();
  updSteer();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;updSteer();});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;updSteer();});
let paused=false;
document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(AU.ctx){paused?AU.ctx.suspend():AU.ctx.resume();}});

/* ---------- resize + adaptive resolution ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(PR);renderer.setSize(w,h,false);composer.setPixelRatio(PR);composer.setSize(w,h);
  camera.aspect=w/h;camera.fov=w<h?62:50;camera.updateProjectionMatrix();
  const db=renderer.getDrawingBufferSize(new THREE.Vector2());HAZE.hazeRes.value.copy(db);grade.uniforms.res.value.copy(db);}
window.addEventListener('resize',resize);resize();
const PRMAX=Math.min(window.devicePixelRatio||1,isTouch?1.5:1.75);
let perfAcc=0,perfN=0,perfT=0;
function adapt(dt){perfAcc+=dt;perfN++;perfT+=dt;if(perfT<2.5)return;const avg=perfAcc/perfN;perfAcc=perfN=perfT=0;
  if(avg>0.026&&PR>0.75){PR=Math.max(0.75,PR-0.25);resize();}else if(avg<0.0135&&PR<PRMAX){PR=Math.min(PR+0.125,PRMAX);resize();}}

/* ---------- main loop ---------- */
resetRider();
camera.position.set(0,11,15);
let last=performance.now(),started=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;if(paused)return;
  step(dt);
  composer.render(dt);
  if(!started){started=true;setTimeout(()=>{$('fade').classList.add('off');$('title').classList.add('on');},120);}
  adapt(dt);
}
function step(dt){
  time+=dt;P.inv-=dt;
  if(mode!=='over')updatePlayer(dt);else{P.v=Math.max(0,P.v-6*dt);P.z-=P.v*dt;root.position.z=P.z;}
  if(mode==='play')spawnPatterns();
  updateCars(dt);updateItems(dt);
  for(const s of strips)s.update(P.z);
  for(const f of followers){f.mesh.position.z=P.z+f.zOff;if(f.tex){const L=f.len,p=f.period;const o=-(0.5*L/p+f.mesh.position.z/p);f.tex.offset.y=o-Math.floor(o);}}
  ocean.position.set(0,-0.35,P.z-COAST-1700+12);beach.position.set(0,0.05,P.z-COAST+3);
  placeSun(P.z);
  updateCamera(dt);
  sky.position.copy(camera.position);
  skyMat.uniforms.time.value=time;oceanMat.uniforms.time.value=time;grade.uniforms.time.value=time;
  for(let i=0;i<MOTES;i++){motePos[i*3]+=Math.sin(time*0.4+moteSeed[i])*0.004;motePos[i*3+1]+=Math.cos(time*0.3+moteSeed[i])*0.003;}
  motes.position.set(camera.position.x,0,camera.position.z);motes.geometry.attributes.position.needsUpdate=true;
  updateHaze();
  if(mode==='play'){
    $('dist').textContent=runDist<1000?Math.floor(runDist):(runDist/1000).toFixed(2);$('unit').textContent=runDist<1000?'m':'km';
    $('tok').textContent=runTok;
    if(runDist>nextCaption){captionIdx=(captionIdx+1)%CAPTIONS.length;caption(CAPTIONS[captionIdx]);nextCaption+=550;}
  }
  if(capTimer>0){capTimer-=dt;if(capTimer<=0)$('caption').classList.remove('on');}
  if(popTimer>0){popTimer-=dt;if(popTimer<=0)$('pop').classList.remove('on');}
  if(P.z<-SHIFT)rebase();
  AU.tick();
}
requestAnimationFrame(frame);
window.__dbg={P,get mode(){return mode},cars,ollie,bloom,scene,HAZE,renderer,sim(sec,fn){for(let t=0;t<sec;t+=1/30){if(fn)fn(t);step(1/30);}}};
</script>
