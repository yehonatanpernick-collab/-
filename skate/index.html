<title>Sundown Boulevard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,800;1,900&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-bleed cinematic WebGL scene; HUD floats on top; captions in two film-subtitle styles. Single committed dusk look. */
:root{
  --ink:#3a1230;
  --cream:#fff6ea;
  --gold:#ffc35a;
  --ember:#ff5a2e;
  --dusk:#160a12;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-impact:'Kanit','Arial Black','Helvetica Neue',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dusk);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--font-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.fx{position:fixed;inset:0;pointer-events:none}
#fade{background:var(--dusk);opacity:1;transition:opacity 1.4s ease}
#fade.off{opacity:0}
.outline{color:var(--cream);font-family:var(--font-display);letter-spacing:.01em;
  text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),
  0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -2px 0 var(--ink),0 6px 0 rgba(58,18,48,.85),0 10px 26px rgba(20,0,10,.5)}
.impact{color:#fff;font-family:var(--font-impact);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em;
  text-shadow:3px 4px 0 rgba(30,6,20,.55),0 0 30px rgba(255,120,60,.35)}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.stat{display:flex;flex-direction:column;gap:3px;min-width:74px}
.stat.right{align-items:flex-end;text-align:right}
.stat .k{font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,236,222,.88);text-shadow:0 1px 4px rgba(30,0,16,.7)}
.stat .v{font-size:24px;line-height:1}
.tok{display:flex;align-items:center;gap:7px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 45%,#c96d14);box-shadow:0 0 12px rgba(255,180,70,.95),0 0 0 2px var(--ink)}
.dist{text-align:center;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.dist small{font-size:20px;margin-left:3px}
#spd{font-size:15px;letter-spacing:.08em;color:var(--gold);margin-top:2px}
#speedfx{background:repeating-conic-gradient(from 0deg at 50% 54%,rgba(255,230,200,0) 0deg,rgba(255,230,200,0) 2.1deg,rgba(255,226,190,.5) 2.4deg,rgba(255,226,190,0) 3deg);-webkit-mask-image:radial-gradient(circle at 50% 54%,transparent 36%,#000 88%);mask-image:radial-gradient(circle at 50% 54%,transparent 36%,#000 88%);opacity:0;mix-blend-mode:screen}

#caption{position:fixed;left:0;right:0;top:22%;text-align:center;line-height:1.05;
  padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transform:translateY(10px) scale(.98);
  transition:opacity 1s ease,transform 1s ease;text-wrap:balance}
#caption.outline{font-size:clamp(28px,7.6vw,54px)}
#caption.impact{font-size:clamp(40px,min(14vw,15vh),110px);top:36%}
#caption.on{opacity:1;transform:none}
#pop{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:28px;pointer-events:none;opacity:0;transition:opacity .25s,transform .3s;transform:scale(.85)}
#pop.on{opacity:1;transform:none}
#pop .sub{display:block;font-size:16px;color:var(--gold)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8vh) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(22,4,14,0) 35%,rgba(22,4,14,.62) 100%);opacity:0;pointer-events:none;transition:opacity .8s}
.screen.on{opacity:1;pointer-events:auto}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.86;font-weight:900}
.logo .a{font-size:clamp(52px,15vw,120px)}
.logo .b{font-size:clamp(30px,8.4vw,66px);color:var(--gold);letter-spacing:.06em}
.screen h2{margin:0;font-size:clamp(40px,11vw,80px);line-height:1}
.tag{margin:0;max-width:32ch;font-weight:800;font-size:16px;line-height:1.45;color:rgba(255,242,230,.95);text-shadow:0 1px 8px rgba(30,0,16,.85)}
.btn{font-family:var(--font-impact);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;
  padding:14px 40px 15px;border-radius:999px;background:linear-gradient(180deg,#ff9248,var(--ember) 60%,#d83a22);
  box-shadow:0 5px 0 var(--ink),0 14px 34px rgba(255,80,30,.5);text-shadow:0 2px 0 rgba(58,18,48,.5);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),0 6px 18px rgba(255,80,30,.4)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.todpick{width:min(260px,80vw)}.todpick button{cursor:pointer}.todpick button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;max-width:460px;font-weight:800;font-size:13px;color:rgba(255,238,226,.95);text-shadow:0 1px 5px rgba(30,0,16,.9)}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys b{display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;background:rgba(255,247,236,.16);border:1px solid rgba(255,247,236,.35);font-weight:900}
.stats{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .k{font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,236,222,.88)}
.stats .v{font-size:30px}
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,247,236,.35);background:rgba(40,10,30,.35);color:var(--cream);font:900 14px var(--font-body);cursor:pointer;backdrop-filter:blur(4px)}
#mute:focus-visible{outline:2px solid var(--cream)}
#err{position:fixed;left:16px;right:16px;bottom:30%;text-align:center;font-weight:800;color:var(--cream)}
#gear{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(255,247,236,.35);background:rgba(40,10,30,.35);color:var(--cream);cursor:pointer;backdrop-filter:blur(4px)}
#gear svg{width:22px;height:22px}
#gear:focus-visible{outline:2px solid var(--cream)}
#fps{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 74px);font:700 12px ui-monospace,Menlo,Consolas,monospace;color:var(--cream);text-shadow:0 1px 3px rgba(20,0,10,.9);pointer-events:none}
#settings{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:56vh;max-height:56dvh;display:flex;flex-direction:column;
  background:rgba(26,8,18,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,200,150,.25);border-radius:18px 18px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y;color:var(--cream)}
@media (min-aspect-ratio:1/1) and (min-width:700px){#settings{left:auto;top:0;width:390px;max-height:none;border-radius:0;border-top:0;border-left:1px solid rgba(255,200,150,.25);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}}
#settings .sh{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px)) 8px 16px}
#settings .sh b{font:400 22px var(--font-display);letter-spacing:.02em}
#settings button{font-family:var(--font-body);color:var(--cream);cursor:pointer}
#sClose{border:0;border-radius:999px;padding:8px 20px;background:linear-gradient(180deg,#ff9248,var(--ember));font-weight:900;font-size:14px;color:#fff}
#sClose:focus-visible,#settings button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.seg span{flex:1 1 auto;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,235,220,.22);background:rgba(255,255,255,.06);font:800 13px var(--font-body);text-align:center;color:rgba(255,240,228,.85)}
.seg .on{background:linear-gradient(180deg,#ff8a45,#e2482b);border-color:transparent;color:#fff}
#sPresets{padding:0 16px 10px}
#sCustom{flex:0 0 auto;border-style:dashed;opacity:.55}#sCustom.on{opacity:1}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid rgba(255,235,220,.14)}
.tabs button{flex:1 1 auto;padding:10px 6px;border:0;background:none;font-weight:800;font-size:13px;color:rgba(255,240,228,.6);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--ember)}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) 8px 16px;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.row{padding:11px 0;border-bottom:1px solid rgba(255,235,220,.08);display:flex;flex-direction:column;gap:7px}
.row .lab{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.row .val{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:900}
.row .hint{font-size:12px;line-height:1.4;color:rgba(255,236,222,.6)}
.row input[type=range]{width:100%;margin:0;height:28px;accent-color:var(--ember)}
.row.toggle{flex-flow:row wrap;align-items:center}
.tog{width:100%;align-items:center;cursor:pointer}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:0 0 auto;width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked+.sw{background:var(--ember)}.tog input:checked+.sw::after{transform:translateX(18px)}
.tog input:focus-visible+.sw{outline:2px solid var(--cream);outline-offset:2px}
.sfoot{padding:8px 16px 12px;border-top:1px solid rgba(255,235,220,.14)}
#sReset{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,235,220,.25);background:none;font-weight:800;font-size:13px}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
@media (prefers-reduced-motion:reduce){#caption,#pop,.screen,#hud,#fade{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Sundown Boulevard game view"></canvas>

<div id="speedfx" class="fx"></div>
<div id="hud">
  <div class="stat"><span class="k">Tokens</span><span class="v outline tok"><i class="coin"></i><span id="tok">0</span></span></div>

</div>
<div id="caption"></div>
<div id="pop" class="outline"></div>

  <h1 class="logo impact"><span class="a">Sundown</span><span class="b">Boulevard</span></h1>
  <p class="tag" id="tagline">An endless golden-hour skate down a palm-lined street that never quite reaches the sea.</p>
  <div class="seg todpick" id="todPick" role="group" aria-label="Time of day"><button type="button" data-t="sunset">Sunset</button><button type="button" data-t="noon">Noon</button></div>

</section>

<section id="over" class="screen" aria-label="Run summary">
  <h2 class="impact" id="overTitle">Wiped out</h2>
  <div class="stats">
    <div><span class="k">Distance</span><span class="v outline" id="oDist">0 m</span></div>
    <div><span class="k">Tokens</span><span class="v outline" id="oTok">0</span></div>
    <div><span class="k">Best</span><span class="v outline" id="oBest">0 m</span></div>
  </div>
  <button class="btn" id="again">Roll again</button>
</section>
<button id="mute" aria-label="Toggle sound">♪</button>
<button id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
<div id="fps" hidden></div>
<section id="settings" role="dialog" aria-label="Settings" hidden>
  <div class="sh"><b>Settings</b><button type="button" id="sClose">Done</button></div>
  <div class="seg" id="sPresets" role="group" aria-label="Quality preset"></div>
  <div class="tabs" id="sTabs" role="tablist"></div>
  <div class="sbody" id="sBody"></div>
  <div class="sfoot"><button type="button" id="sReset">Reset to defaults</button></div>
</section>
<div id="fade" class="fx"></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hsh=(s,k)=>{const x=Math.sin(s*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;

/* =========================================================
   Settings (saved in this browser)
   ========================================================= */
const PRESETS={
  low:{res:0.75,shadow:1024,msaa:0,bloom:0,scenery:0,rays:0},
  medium:{res:1.25,shadow:2048,msaa:2,bloom:0.25,scenery:1,rays:0.35},
  high:{res:1.5,shadow:3072,msaa:4,bloom:0.3,scenery:2,rays:0.6},
  ultra:{res:2,shadow:4096,msaa:4,bloom:0.35,scenery:2,rays:0.8}};
const PRESET_KEYS=['res','shadow','msaa','bloom','scenery','rays'];
const DEFAULTS=Object.assign({tod:'sunset',preset:isTouch?'medium':'high',reflect:true,auto:true,grain:0.03,vig:0.42,sat:1.2,con:1.05,sunH:0.15,sunA:-0.2,sunPow:7,warm:0.7,amb:0.3,expo:1.55,fog:820,glare:1,fov:0,camH:1,shake:true,music:0.3,sfx:0.8,fps:false},PRESETS[isTouch?'medium':'high']);
const SKEY='sundown-settings-v1';
const S=Object.assign({},DEFAULTS);
try{const raw=JSON.parse(store.get(SKEY)||'null');if(raw&&typeof raw==='object')for(const k in DEFAULTS)if(typeof raw[k]===typeof DEFAULTS[k]&&(typeof raw[k]!=='number'||isFinite(raw[k])))S[k]=raw[k];}catch(e){}

S.res=clamp(S.res,0.5,2.5);

/* =========================================================
   Renderer, post-processing, atmosphere
   ========================================================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false});

renderer.setPixelRatio(PR);

THREE.ShaderChunk.tonemapping_pars_fragment=THREE.ShaderChunk.tonemapping_pars_fragment.replace(/vec3 ReinhardToneMapping\( vec3 color \) \{[\s\S]*?\n\}/,`vec3 ReinhardToneMapping( vec3 color ) {
  color *= toneMappingExposure;
  vec3 pc = 1.0 - exp( -color );
  float m = max( max( color.r, color.g ), color.b );
  vec3 hp = color * ( ( 1.0 - exp( -m ) ) / max( m, 1e-5 ) );
  vec3 c = mix( pc, hp, 0.55 );
  float w = smoothstep( 2.5, 14.0, m );
  return saturate( mix( c, vec3( 1.0 ), w * 0.8 ) );

renderer.toneMapping=THREE.ReinhardToneMapping;
renderer.toneMappingExposure=1.55;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.3,6000);
const SUN=new V3(-0.2,0.15,-1).normalize();
const MAXANISO=renderer.capabilities.getMaxAnisotropy();
const BEHIND=25, RANGE=390, COAST=362;

// Atmospheric haze: fog that glows gold toward the sun and burns red away from it
const HAZE={hazeRes:{value:new THREE.Vector2(1,1)},hazeSun:{value:new THREE.Vector2(0.3,0.9)},hazeSunCol:{value:new THREE.Color().setRGB(0.55,0.22,0.04)}};
THREE.ShaderChunk.fog_pars_fragment=`#ifdef USE_FOG
uniform vec3 fogColor;varying float vFogDepth;uniform float fogNear;uniform float fogFar;
uniform vec2 hazeRes;uniform vec2 hazeSun;uniform vec3 hazeSunCol;
#endif`;
THREE.ShaderChunk.fog_fragment=`#ifdef USE_FOG
float fogFactor=smoothstep(fogNear,fogFar,vFogDepth);

float sunAmt=exp(-dot(sp,sp)*10.);

#endif`;
scene.fog=new THREE.Fog(new THREE.Color().setRGB(0.95,0.22,0.07),70,820);
function haze(m){m.onBeforeCompile=s=>{Object.assign(s.uniforms,HAZE);};return m;}

const hemi=new THREE.HemisphereLight(new THREE.Color().setRGB(1.0,0.35,0.18),new THREE.Color().setRGB(0.22,0.06,0.08),0.3);
scene.add(hemi);
const sun=new THREE.DirectionalLight(new THREE.Color().setRGB(1.0,0.48,0.18),7.0);
let SHADOW=S.shadow||2048;
sun.castShadow=S.shadow>0;
sun.shadow.mapSize.set(SHADOW,SHADOW);
const SC=sun.shadow.camera;SC.left=-40;SC.right=40;SC.top=40;SC.bottom=-40;SC.near=1;SC.far=1000;
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.04;
scene.add(sun,sun.target);
const LZ=SUN.clone(),LX=new V3().crossVectors(new V3(0,1,0),LZ).normalize(),LY=new V3().crossVectors(LZ,LX);
let TX=80/SHADOW,TY=80/SHADOW;
function applySun(){if(S.tod==='noon')SUN.set(-0.25+S.sunA,1.5,0.35).normalize();else SUN.set(S.sunA,S.sunH,-1).normalize();LZ.copy(SUN);LX.crossVectors(new V3(0,1,0),LZ).normalize();LY.crossVectors(LZ,LX);}
applySun();
function placeSun(pz){
  const T=new V3(0,0,pz-(S.tod==='noon'?35:115));
  let a=T.dot(LX),b=T.dot(LY);const c=T.dot(LZ);
  a=Math.round(a/TX)*TX;b=Math.round(b/TY)*TY;
  T.copy(LX).multiplyScalar(a).addScaledVector(LY,b).addScaledVector(LZ,c);
  sun.target.position.copy(T);sun.position.copy(T).addScaledVector(SUN,450);
}

/* ---------- sky ---------- */
const NOISE=`
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}

// merge parts into one geometry with vertex colours, uvs and material groups
function merge(parts,nMat=1){
  const B=Array.from({length:nMat},()=>({p:[],n:[],u:[],c:[]}));const col=new THREE.Color();
  for(const pt of parts){
    let g=pt.geo.index?pt.geo.toNonIndexed():pt.geo.clone();
    if(pt.m)g.applyMatrix4(pt.m);
    if(!g.attributes.normal)g.computeVertexNormals();
    const P=g.attributes.position.array,N=g.attributes.normal.array,U=g.attributes.uv?g.attributes.uv.array:null;
    const b=B[pt.mi||0];col.set(pt.color);const su=pt.uv?pt.uv[0]:1,sv=pt.uv?pt.uv[1]:1;
    for(let i=0;i<P.length;i++){b.p.push(P[i]);b.n.push(N[i]);}
    const vc=P.length/3;
    for(let i=0;i<vc;i++){b.c.push(col.r,col.g,col.b);if(U)b.u.push(U[i*2]*su,U[i*2+1]*sv);else b.u.push(0,0);}
  }

  B.forEach((b,i)=>{const cnt=b.p.length/3;if(cnt){g.addGroup(start,cnt,i);start+=cnt;}for(const v of b.p)p.push(v);for(const v of b.n)n.push(v);for(const v of b.u)u.push(v);for(const v of b.c)c.push(v);});
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  g.computeBoundingSphere();return g;
}
function Builder(){const parts=[];return{parts,
  add(geo,color,mi,x,y,z,rx,ry,rz,sx,sy,sz,uv){parts.push({geo,color,mi,uv,m:M(x,y,z,rx,ry,rz,sx,sy,sz)});},
  box(w,h,d,color,mi,x=0,y=0,z=0,rx=0,ry=0,rz=0){parts.push({geo:new THREE.BoxGeometry(w,h,d),color,mi,uv:[Math.max(w,d)/3,h/3],m:M(x,y,z,rx,ry,rz)});},
  raw(geo,color,mi){parts.push({geo,color,mi});},
  done(n){return merge(parts,n);}};}
// planar polygons with world-scaled uvs (used for tiled roofs and gables)
function polyGeo(polys,tw=1,th=1){
  const pos=[],uv=[];
  for(const {pts,out} of polys){
    let P=pts;
    let nn=new V3().subVectors(P[1],P[0]).cross(new V3().subVectors(P[2],P[0]));
    if(nn.dot(out)<0){P=[...P].reverse();nn=new V3().subVectors(P[1],P[0]).cross(new V3().subVectors(P[2],P[0]));}
    nn.normalize();
    let e=new V3().subVectors(P[1],P[0]);if(Math.abs(e.y)>0.5*e.length())e=new V3().subVectors(P[0],P[P.length-1]);e.normalize();
    const u2=new V3().crossVectors(nn,e);
    for(let i=1;i<P.length-1;i++)for(const q of [P[0],P[i],P[i+1]]){pos.push(q.x,q.y,q.z);const d=q.clone().sub(P[0]);uv.push(d.dot(e)/tw,d.dot(u2)/th);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();return g;
}

function makeParticles(n,size){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3);
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));

  pts.frustumCulled=false;scene.add(pts);

  let head=0;
  return{
    emit(x,y,z,vx,vy,vz,life,r,g,b,grav,drag){const p=L[head];head=(head+1)%n;p.life=p.max=life;p.x=x;p.y=y;p.z=z;p.vx=vx;p.vy=vy;p.vz=vz;p.r=r;p.g=g;p.b=b;p.grav=grav||0;p.drag=drag||0;},
    update(dt){

        if(p.life>0){p.life-=dt;p.vy-=p.grav*dt;const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy*=d;p.vz*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
          const f=Math.max(0,p.life/p.max);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;col[i*3]=p.r*f;col[i*3+1]=p.g*f;col[i*3+2]=p.b*f;}
        else if(pos[i*3+1]>-90){pos[i*3+1]=-99;col[i*3]=col[i*3+1]=col[i*3+2]=0;}}
      geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;}
  };
}

const LANES=[-2.4,0,2.4];

    else if(r<0.3){const cx=clamp(lx+rand(-0.5,0.5),-3.4,3.4);addCone(cx,z-10);for(let k=0;k<5;k++)addTok(cx,0.9+1.6*Math.sin(Math.PI*k/4),z-4-k*3.2);}

/* ---------- traffic ---------- */
const SUBLANES={on:[-3.4,-1.6],same:[1.6,3.4]};
function carCap(){if(mode==='title')return{on:3,same:1};return{on:Math.min(5,2+Math.floor(runDist/260)),same:Math.min(3,1+Math.floor(runDist/420))};}
function spawnCar(c){
  const cap=carCap(),nOn=cars.filter(o=>o.active&&o.lane<0).length,nSame=cars.filter(o=>o.active&&o.lane>0).length;
  let lane=0;
  if(nOn<cap.on&&(Math.random()<0.7||nSame>=cap.same))lane=-1;else if(nSame<cap.same)lane=1;
  if(!lane){c.wait=rand(0.8,2);return;}
  const x=(lane<0?SUBLANES.on:SUBLANES.same)[Math.random()<0.5?0:1]+rand(-0.12,0.12);
  const z=lane<0?P.z-COAST+rand(5,40):P.z+BEHIND+8;
  for(const o of cars)if(o.active&&Math.abs(o.x-x)<1.7&&Math.abs(o.z-z)<(lane<0?42:30)){c.wait=rand(0.4,1.5);return;}
  c.lane=lane;c.x=x;c.z=z;
  c.cruise=lane<0?rand(8,12)*(1+0.45*speedT):Math.max(P.v+rand(4,7),13);
  c.v=c.cruise;c.active=true;c.honked=false;c.jumped=false;c.pdz=P.z-z;c.g.visible=true;
  c.paint.color.setHex((c.type==='bus'?BUS_PAINTS:PAINTS)[(Math.random()*(c.type==='bus'?BUS_PAINTS:PAINTS).length)|0]);
  c.roofG.visible=Math.random()<0.32;c.surfMat.color.setHex(SURF_COLS[(Math.random()*SURF_COLS.length)|0]);
  c.g.rotation.y=lane<0?Math.PI:0;
}
function updateCars(dt){
  for(const c of cars){
    if(!c.active){c.wait-=dt;if(c.wait<=0)spawnCar(c);continue;}
    let braking=false;
    if(c.lane>0){
      const gap=c.z-P.z,inLane=Math.abs(P.x-c.x)<1.6&&P.y<1.2;
      if(inLane&&gap>3&&gap<14&&P.state==='ride'){c.v=Math.max(0,Math.min(c.v,P.v-(14-gap)*0.4));braking=true;if(!c.honked&&gap<11){c.honked=true;AU.horn();}}
      else c.v=Math.min(c.cruise,c.v+4*dt);
      c.z-=c.v*dt;
    }else c.z+=c.v*dt;
    c.g.position.set(c.x,0.012*Math.sin(time*9+c.seed)*Math.min(1,c.v/10),c.z);
    for(const w of c.wheels)w.rotation.x-=c.v/WR*dt;
    const bright=braking||c.v<c.cruise-1?6:3.5;c.tailMat.color.setRGB(bright,bright*0.07,bright*0.04);
    const g=Math.pow(Math.max(0,Math.sin(time*1.1+c.seed)),10);
    c.glint.material.opacity=(c.lane<0?0.3:0.12)+g*0.9;const s=1.8+g*2.6;c.glint.scale.set(s,s,1);
    if(c.z>P.z+BEHIND+12||c.z<P.z-COAST-40){c.active=false;c.g.visible=false;c.wait=rand(0.5,3.0);}
  }
}

const G=20,TRICKS={kick:{n:'Kickflip',p:1,f:1,s:0},heel:{n:'Heelflip',p:1,f:-1,s:0},shuv:{n:'Shove-it',p:1,f:0,s:1},tre:{n:'360 Flip',p:3,f:1,s:2}};
const easeOut=t=>1-Math.pow(1-t,2.3);
function resetTrickState(){P.flipA=P.flipTo=P.flipBase=0;P.shuvA=P.shuvTo=P.shuvBase=0;P.tricks=[];P.grabT=0;P.fp=0;P.sp=0;}
function ollie(kind){
  if(P.state!=='ride')return;
  if(P.grind){endGrind(true);if(kind&&kind!==true)doTrick(kind);return;}
  if(!P.air){
    P.air=true;P.vy=9.4;P.ollieT=0;P.airT=0;P.cv-=2.8;P.pushT=-1;P.big=false;P.onRamp=null;resetTrickState();AU.pop();puff(P.x,P.y,P.z,4,1.4);
    if(kind===true)kind='kick';
    if(kind)doTrick(kind);
  }else if(kind){doTrick(kind===true?'kick':kind);}
}
function doTrick(kind){
  const T=TRICKS[kind];if(!T||!P.air||P.state!=='ride')return;
  const t=P.ollieT;
  const flipBusy=P.flipTo!==P.flipBase&&(t-P.flipT0)<P.flipDur,shuvBusy=P.shuvTo!==P.shuvBase&&(t-P.shuvT0)<P.shuvDur;

  const rem=(P.vy+Math.sqrt(Math.max(0,P.vy*P.vy+2*G*P.y)))/G;if(rem<0.36)return;

  if(T.f){P.flipTo=P.flipBase+T.f*Math.PI*2;P.flipT0=t;P.flipDur=Math.min(0.46,rem*0.75);}
  if(T.s){P.shuvTo=P.shuvBase+T.s*Math.PI;P.shuvT0=t;P.shuvDur=Math.min(0.34*T.s+0.1,rem*0.8);}

function autoTrick(){const k=['kick','heel','shuv','tre'][autoTrickI++%4];ollie(k);}
function settleTricks(extra){

  let pts=0;const names=[];
  if(mode==='play'){
    if(ok){for(const T of P.tricks){pts+=T.p;names.push(T.n);}if(P.grabT>=0.35){pts+=1;names.push('Grab');}if(P.big&&P.airT>1.1&&!extra){pts+=1;names.push('Big air');}}
    else if(P.tricks.length){pop('Sketchy!');P.v*=0.92;P.stumT=0.45;}
    if(extra){pts+=extra.p;names.push(extra.n);}
    if(names.length){if(names.length>1)pts+=names.length-1;runTok+=pts;pop(names.join(' + '),'+'+pts+(pts>1?' tokens':' token'));AU.trick();if(names.length>=3||pts>=4)P.celT=0.9;}
  }

}
function land(h){

  P.flipA=P.flipTo=P.flipBase=0;P.shuvA=P.shuvTo=P.shuvBase=0;P.fp=P.sp=0;AU.land();
