<title>Sundown Boulevard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-bleed WebGL scene, HUD floats on top, chunky outlined captions like a film subtitle. Single committed dusk look. */
:root{
  --ink:#3a1838;        /* outline / shadow plum */
  --cream:#fff7ec;      /* caption fill */
  --gold:#ffc65c;       /* tokens, highlights */
  --ember:#ff6b3d;      /* primary action */
  --dusk:#1c0e1d;       /* page ground */
  --veil:rgba(44,14,38,.42);
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dusk);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--font-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.fx{position:fixed;inset:0;pointer-events:none}
#glare{position:fixed;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;left:30%;top:10%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,190,.55) 0,rgba(255,180,90,.22) 22%,rgba(255,120,60,.08) 45%,rgba(255,100,50,0) 68%);
  mix-blend-mode:screen;transition:opacity .3s}
#vignette{background:radial-gradient(ellipse 120% 90% at 50% 38%,rgba(0,0,0,0) 55%,rgba(40,6,26,.5) 100%)}
#grade{background:linear-gradient(180deg,rgba(255,120,60,.08),rgba(255,160,80,0) 40%,rgba(60,10,40,.18));mix-blend-mode:soft-light}
#fade{background:#1c0e1d;opacity:0;transition:opacity .6s}

.outline{color:var(--cream);font-family:var(--font-display);letter-spacing:.01em;
  text-shadow:0 0 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),
  0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -2px 0 var(--ink),0 6px 0 rgba(58,24,56,.85),0 10px 24px rgba(30,0,20,.45)}

#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.stat{display:flex;flex-direction:column;gap:2px;min-width:70px}
.stat.right{align-items:flex-end;text-align:right}
.stat .k{font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,240,225,.85);text-shadow:0 1px 3px rgba(40,0,20,.6)}
.stat .v{font-size:24px;line-height:1}
.tok{display:flex;align-items:center;gap:7px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 45%,#d07a1a);box-shadow:0 0 10px rgba(255,190,80,.9),0 0 0 2px var(--ink)}
.dist{text-align:center;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.dist small{font-size:20px;margin-left:3px}

#caption{position:fixed;left:0;right:0;top:24%;text-align:center;font-size:clamp(28px,7.6vw,52px);line-height:1.08;
  padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;opacity:0;transform:translateY(8px);
  transition:opacity .9s ease,transform .9s ease;text-wrap:balance}
#caption.on{opacity:1;transform:none}
#pop{position:fixed;left:0;right:0;top:44%;text-align:center;font-size:26px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.9)}
#pop.on{opacity:1;transform:none}
#pop .sub{display:block;font-size:16px;color:var(--gold)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 9vh) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(28,6,24,0) 30%,rgba(28,6,24,.55) 100%);opacity:0;pointer-events:none;transition:opacity .7s}
.screen.on{opacity:1;pointer-events:auto}
.screen h1{margin:0;font-size:clamp(46px,13vw,96px);line-height:.92;font-weight:400;text-wrap:balance}
.screen h2{margin:0;font-size:clamp(34px,9vw,64px);line-height:1;font-weight:400}
.tag{margin:0;max-width:30ch;font-weight:800;font-size:16px;line-height:1.45;color:rgba(255,244,232,.95);text-shadow:0 1px 6px rgba(40,0,20,.7)}
.btn{font-family:var(--font-display);font-size:24px;letter-spacing:.02em;color:var(--cream);border:0;cursor:pointer;
  padding:15px 38px 16px;border-radius:999px;background:linear-gradient(180deg,#ff9a4d,var(--ember) 60%,#e2482b);
  box-shadow:0 5px 0 var(--ink),0 12px 30px rgba(255,90,40,.45);text-shadow:0 2px 0 rgba(58,24,56,.6);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),0 6px 18px rgba(255,90,40,.4)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;max-width:440px;font-weight:800;font-size:13px;color:rgba(255,240,228,.92);text-shadow:0 1px 4px rgba(40,0,20,.8)}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys b{display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;background:rgba(255,247,236,.16);border:1px solid rgba(255,247,236,.35);font-weight:900}
.stats{display:flex;gap:26px;justify-content:center}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .k{font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,240,225,.85)}
.stats .v{font-size:30px}
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,247,236,.35);background:rgba(44,14,38,.35);color:var(--cream);font:900 13px var(--font-body);cursor:pointer;backdrop-filter:blur(4px)}
#mute:focus-visible{outline:2px solid var(--cream)}
@media (prefers-reduced-motion:reduce){#caption,#pop,.screen,#hud{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Sundown Boulevard game view"></canvas>
<div id="grade" class="fx"></div>
<div id="glare"></div>
<div id="vignette" class="fx"></div>

<div id="hud">
  <div class="stat"><span class="k">Tokens</span><span class="v outline tok"><i class="coin"></i><span id="tok">0</span></span></div>
  <div class="dist outline"><span id="dist">0</span><small id="unit">m</small></div>
  <div class="stat right"><span class="k">Best</span><span class="v outline" id="best">0 m</span></div>
</div>
<div id="caption" class="outline"></div>
<div id="pop" class="outline"></div>
<div id="fade" class="fx"></div>

<section id="title" class="screen on" aria-label="Start">
  <h1 class="outline">Sundown<br>Boulevard</h1>
  <p class="tag">An endless golden-hour skate down a palm-lined street that never quite reaches the sea.</p>
  <button class="btn" id="play">Start rolling</button>
  <div class="keys" id="keys"></div>
</section>

<section id="over" class="screen" aria-label="Run summary">
  <h2 class="outline" id="overTitle">Wiped out</h2>
  <div class="stats">
    <div><span class="k">Distance</span><span class="v outline" id="oDist">0 m</span></div>
    <div><span class="k">Tokens</span><span class="v outline" id="oTok">0</span></div>
    <div><span class="k">Best</span><span class="v outline" id="oBest">0 m</span></div>
  </div>
  <button class="btn" id="again">Roll again</button>
</section>
<button id="mute" aria-label="Toggle sound">♪</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hsh=(s,k)=>{const x=Math.sin(s*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.6:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=new THREE.Color(0.96,0.56,0.38);
scene.fog=new THREE.Fog(FOG,45,820);
const camera=new THREE.PerspectiveCamera(60,1,0.3,6000);
const SUN=new V3(-0.2,0.175,-1).normalize();
const MAXANISO=renderer.capabilities.getMaxAnisotropy();

const BEHIND=25, RANGE=440, COAST=410;

scene.add(new THREE.HemisphereLight(0xffa070,0x52243a,0.8));
scene.add(new THREE.AmbientLight(0x7a3c58,0.22));
const sun=new THREE.DirectionalLight(0xffbb7a,1.6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const SC=sun.shadow.camera; SC.left=-40;SC.right=40;SC.top=46;SC.bottom=-46;SC.near=1;SC.far=900;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.035;
scene.add(sun,sun.target);
const LZ=SUN.clone(), LX=new V3().crossVectors(new V3(0,1,0),LZ).normalize(), LY=new V3().crossVectors(LZ,LX);
const TX=80/2048, TY=92/2048;
function placeSun(pz){
  const T=new V3(0,0,pz-100);
  let a=T.dot(LX),b=T.dot(LY);const c=T.dot(LZ);
  a=Math.round(a/TX)*TX; b=Math.round(b/TY)*TY;
  T.copy(LX).multiplyScalar(a).addScaledVector(LY,b).addScaledVector(LZ,c);
  sun.target.position.copy(T); sun.position.copy(T).addScaledVector(SUN,420);
}

/* ---------- geometry helpers ---------- */
const _o=new THREE.Object3D();
function M(x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){_o.position.set(x,y,z);_o.rotation.set(rx,ry,rz);_o.scale.set(sx,sy,sz);_o.updateMatrix();return _o.matrix.clone();}
function merge(parts){
  const pos=[],nor=[],col=[];const c=new THREE.Color();
  for(const p of parts){
    let g=p.geo.index?p.geo.toNonIndexed():p.geo.clone();
    if(p.m)g.applyMatrix4(p.m);
    if(!g.attributes.normal)g.computeVertexNormals();
    const P=g.attributes.position.array,N=g.attributes.normal.array;c.set(p.color);
    for(let i=0;i<P.length;i++){pos.push(P[i]);nor.push(N[i]);}
    for(let i=0;i<P.length/3;i++)col.push(c.r,c.g,c.b);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeBoundingSphere();return g;
}
function tri(o,a,b,c){o.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z);}
function triGeo(arr){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));g.computeVertexNormals();return g;}
function Builder(){const parts=[];return{parts,
  add(geo,color,x,y,z,rx,ry,rz,sx,sy,sz){parts.push({geo,color,m:M(x,y,z,rx,ry,rz,sx,sy,sz)});},
  box(w,h,d,color,x=0,y=0,z=0,rx=0,ry=0,rz=0){parts.push({geo:new THREE.BoxGeometry(w,h,d),color,m:M(x,y,z,rx,ry,rz)});},
  done(){return merge(parts);}};}

/* ---------- textures ---------- */
function canvasTex(w,h,draw,rep){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(cv);t.wrapS=rep?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;t.wrapT=THREE.RepeatWrapping;t.anisotropy=MAXANISO;return t;}
function speckle(g,w,h,n,cols,size){for(let i=0;i<n;i++){g.fillStyle=cols[(Math.random()*cols.length)|0];const s=size*(0.5+Math.random());g.fillRect(Math.random()*w,Math.random()*h,s,s);}}
// road: 9.6 m wide, 32 m period
const ROADW=9.6, ROADP=32;
const roadTex=canvasTex(256,1024,(g,w,h)=>{
  g.fillStyle='#6a5651';g.fillRect(0,0,w,h);
  speckle(g,w,h,9000,['rgba(255,240,230,.07)','rgba(20,10,10,.10)','rgba(120,100,95,.12)'],2.2);
  const px=m=>(m+ROADW/2)/ROADW*w, py=m=>m/ROADP*h;
  // worn wheel paths
  g.fillStyle='rgba(30,20,20,.10)';[-3.2,-1.6,1.6,3.2].forEach(x=>g.fillRect(px(x)-8,0,16,h));
  // patches
  for(let i=0;i<5;i++){g.fillStyle='rgba(40,30,30,.13)';g.fillRect(px(rand(-4,3)),py(rand(0,30)),rand(20,60),rand(30,140));}
  // cracks
  g.strokeStyle='rgba(25,15,15,.28)';g.lineWidth=1.2;
  for(let i=0;i<10;i++){g.beginPath();let x=px(rand(-4.4,4.4)),y=py(rand(0,32));g.moveTo(x,y);for(let k=0;k<6;k++){x+=rand(-6,6);y+=rand(4,16);g.lineTo(x,y);}g.stroke();}
  // edge lines
  g.fillStyle='rgba(238,226,206,.75)';g.fillRect(px(-4.35),0,px(-4.22)-px(-4.35),h);g.fillRect(px(4.22),0,px(4.35)-px(4.22),h);
  // center dashes (3 m every 8 m)
  g.fillStyle='#f3dca4';for(let z=0;z<ROADP;z+=8)g.fillRect(px(-0.07),py(z),px(0.07)-px(-0.07),py(3));
},false);
const grassTex=canvasTex(128,128,(g,w,h)=>{
  g.fillStyle='#7c7a3e';g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){g.fillStyle=Math.random()<.5?'rgba(80,95,40,.35)':'rgba(160,140,80,.25)';g.beginPath();g.arc(rand(0,w),rand(0,h),rand(4,16),0,7);g.fill();}
  speckle(g,w,h,2500,['rgba(60,70,30,.35)','rgba(170,160,90,.25)'],1.6);
},true);
const walkTex=canvasTex(128,128,(g,w,h)=>{
  g.fillStyle='#d8c6b1';g.fillRect(0,0,w,h);
  speckle(g,w,h,2500,['rgba(90,70,60,.10)','rgba(255,255,255,.12)'],1.6);
  g.fillStyle='rgba(90,70,60,.38)';g.fillRect(0,0,w,2);g.fillRect(0,0,1,h);g.fillRect(w-1,0,1,h);
},true);

/* ---------- sky ---------- */
const NOISE=`
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}`;
const HORIZON=`vec3 horizonCol(vec3 d,vec3 s){float az=max(dot(normalize(vec3(d.x,0.,d.z)),normalize(vec3(s.x,0.,s.z))),0.);
  return mix(vec3(0.98,0.56,0.34),vec3(1.0,0.82,0.50),pow(az,6.));}`;
const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,24),new THREE.ShaderMaterial({
  uniforms:{sunDir:{value:SUN},time:{value:0}},
  side:THREE.BackSide,depthWrite:false,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
  fragmentShader:`uniform vec3 sunDir;uniform float time;varying vec3 vDir;${NOISE}${HORIZON}
  void main(){
    vec3 d=normalize(vDir);float h=d.y;float sd=max(dot(d,sunDir),0.);
    vec3 hz=horizonCol(d,sunDir);
    float t=max(h,0.);
    vec3 col=mix(hz,vec3(0.97,0.40,0.16),smoothstep(0.0,0.12,t));
    col=mix(col,vec3(0.88,0.22,0.11),smoothstep(0.1,0.4,t));
    col=mix(col,vec3(0.48,0.09,0.14),smoothstep(0.4,0.95,t));
    col+=vec3(1.0,0.5,0.2)*pow(sd,14.)*0.5+vec3(1.0,0.82,0.5)*pow(sd,90.)*0.75;
    // clouds
    vec2 uv=d.xz/max(h+0.07,0.03);uv=vec2(uv.x*0.42,uv.y)*0.33+vec2(time*0.004,time*0.0015);
    float n=fbm(uv+fbm(uv*0.6+3.1)*0.9);
    float band=smoothstep(0.02,0.11,h);
    float cover=smoothstep(0.46,0.74,n)*band;
    float lit=pow(sd,3.)*0.9+0.1;
    float thin=1.-smoothstep(0.46,0.62,n);
    vec3 cc=mix(vec3(0.58,0.10,0.10),vec3(0.98,0.34,0.14),lit);
    cc+=thin*vec3(1.0,0.62,0.28)*(0.25+lit);
    cc=mix(cc,vec3(0.42,0.07,0.13),smoothstep(0.35,0.9,h)*0.6);
    col=mix(col,cc,cover*0.88);
    // sun disc + bloom
    float cs=dot(d,sunDir);
    float disc=smoothstep(0.99660,0.99740,cs);
    col=mix(col,vec3(1.0,0.96,0.84)*1.25,disc*(1.-cover*0.35));
    col+=vec3(1.0,0.86,0.6)*pow(sd,350.)*0.9;
    if(h<0.)col=hz;
    gl_FragColor=vec4(col,1.);
  }`
}));
sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);

/* ---------- ocean ---------- */
const oceanMat=new THREE.ShaderMaterial({
  uniforms:{sunDir:{value:SUN},time:{value:0}},
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform vec3 sunDir;uniform float time;varying vec3 vW;${HORIZON}
  void main(){
    vec3 vd=vW-cameraPosition;float dist=length(vd);vd/=dist;
    vec2 p=vW.xz;
    float az=max(dot(normalize(vd.xz),normalize(sunDir.xz)),0.);
    float sp=sin(p.x*1.9+time*2.1)*sin(p.y*0.9-time*1.6)*sin((p.x*0.7+p.y*0.4)*1.3+time*1.2);
    sp=smoothstep(0.15,0.85,sp);
    float w=sin(p.y*0.25+time*0.9)*0.5+0.5;
    vec3 water=mix(vec3(0.20,0.17,0.42),vec3(0.30,0.22,0.48),w*0.4);
    float fres=pow(1.-abs(vd.y),6.);
    vec3 col=mix(water,vec3(0.78,0.42,0.46),fres*0.55);
    float column=pow(az,900.);float broad=pow(az,90.);
    col+=vec3(1.0,0.78,0.42)*(column*(0.5+1.8*sp)+broad*(0.18+0.5*sp)*0.6);
    col=mix(col,horizonCol(vd,sunDir),smoothstep(400.,3200.,dist)*0.5);
    gl_FragColor=vec4(col,1.);
  }`
});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(7000,3200),oceanMat);
ocean.rotation.x=-Math.PI/2;ocean.frustumCulled=false;scene.add(ocean);
const beach=new THREE.Mesh(new THREE.PlaneGeometry(900,34),new THREE.MeshLambertMaterial({color:0xe0a978}));
beach.rotation.x=-Math.PI/2;beach.receiveShadow=true;scene.add(beach);

/* ---------- ground that follows the player ---------- */
const followers=[];
function follower(mesh,len,period,tex,zOff){mesh.frustumCulled=false;followers.push({mesh,len,period,tex,zOff});scene.add(mesh);return mesh;}
const LAND_LEN=BEHIND+15+COAST, LAND_OFF=(BEHIND+15-COAST)/2;
{
  const g=new THREE.PlaneGeometry(ROADW,LAND_LEN);g.rotateX(-Math.PI/2);
  roadTex.repeat.set(1,LAND_LEN/ROADP);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:roadTex}));m.receiveShadow=true;
  follower(m,LAND_LEN,ROADP,roadTex,LAND_OFF);
}
for(const s of [-1,1]){
  const gt=grassTex.clone();gt.needsUpdate=true;gt.repeat.set(196/4,LAND_LEN/4);
  const g=new THREE.PlaneGeometry(196,LAND_LEN);g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:gt}));m.position.set(s*(4.72+98),0.1,0);m.receiveShadow=true;
  follower(m,LAND_LEN,4,gt,LAND_OFF);
  const wt=walkTex.clone();wt.needsUpdate=true;wt.repeat.set(1,LAND_LEN/2);
  const g2=new THREE.PlaneGeometry(2,LAND_LEN);g2.rotateX(-Math.PI/2);

function frond(o,base,ang,lift,len){
  const d=new V3(Math.cos(ang),0,Math.sin(ang)),s=new V3(-Math.sin(ang),0,Math.cos(ang));
  const pts=[],segs=4;
  for(let k=0;k<=segs;k++){const t=k/segs;pts.push(base.clone().addScaledVector(d,t*len).add(new V3(0,(lift*t-0.22*t*t)*len,0)));}
  for(let k=0;k<segs;k++){const a=pts[k],c=pts[k+1],w=0.05;
    tri(o,a.clone().addScaledVector(s,w),c.clone().addScaledVector(s,w),c.clone().addScaledVector(s,-w));
    tri(o,a.clone().addScaledVector(s,w),c.clone().addScaledVector(s,-w),a.clone().addScaledVector(s,-w));}
  const E=pts[segs],tg=E.clone().sub(pts[segs-1]).normalize(),n=8;
  for(let j=0;j<n;j++){
    const a=-1.3+2.6*j/(n-1);
    const dir=tg.clone().multiplyScalar(Math.cos(a)).addScaledVector(s,Math.sin(a));dir.y-=0.25+0.2*Math.abs(a);dir.normalize();
    const L=1.9*(1-0.25*Math.abs(a));
    const perp=new V3().crossVectors(dir,new V3(0,1,0)).normalize();
    const mid=E.clone().addScaledVector(dir,L*0.5);mid.y-=0.12*L;
    const tip=E.clone().addScaledVector(dir,L);tip.y-=0.42*L;
    const w0=0.15,w1=0.1;
    tri(o,E.clone().addScaledVector(perp,w0),mid.clone().addScaledVector(perp,w1),mid.clone().addScaledVector(perp,-w1));
    tri(o,E.clone().addScaledVector(perp,w0),mid.clone().addScaledVector(perp,-w1),E.clone().addScaledVector(perp,-w0));
    tri(o,mid.clone().addScaledVector(perp,w1),tip,mid.clone().addScaledVector(perp,-w1));
  }
}

  constructor(geo,mat,count,spacing,offset,place,opt={}){

  put(i){dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);tmpCol.setRGB(1,1,1);
    this.place(dummy,this.zs[i],this.seeds[i],tmpCol);dummy.updateMatrix();this.mesh.setMatrixAt(i,dummy.matrix);
    if(this.tint)this.mesh.setColorAt(i,tmpCol);}
  flush(){this.mesh.instanceMatrix.needsUpdate=true;if(this.tint&&this.mesh.instanceColor)this.mesh.instanceColor.needsUpdate=true;}
  update(pz){let ch=false;const span=this.count*this.spacing;

    if(ch)this.flush();}
  shift(dz){for(let i=0;i<this.count;i++){this.zs[i]+=dz;this.put(i);}this.flush();}
}

  V.HF.copy(V.H).add(_a.set(0,-0.02,-0.09));V.HB.copy(V.H).add(_a.set(0,-0.02,0.09));
  let lift=0;if(P.air&&P.flip)lift=Math.sin(clamp(P.ollieT/0.5,0,1)*Math.PI)*0.3;
  V.FF.set(0,deck+0.07+lift+P.pitch*0.22,-0.25);V.FB.set(0,deck+0.07+lift*0.7,0.27);
  if(P.pushT>=0){const p=P.pushT;let fx=0.25,fy,fz;
    if(p<0.22){const t=p/0.22;fx=lerp(0,0.25,t);fy=lerp(deck+0.07,0.12,t)+Math.sin(t*Math.PI)*0.1;fz=lerp(0.27,-0.05,t);}
    else if(p<0.75){const t=(p-0.22)/0.53;fy=0.12;fz=lerp(-0.05,0.8,t);}
    else{const t=(p-0.75)/0.25;fx=lerp(0.25,0,t);fy=lerp(0.12,deck+0.07,t)+Math.sin(t*Math.PI)*0.16;fz=lerp(0.8,0.27,t);}
    V.FB.set(fx,fy,fz);}
  ik(V.HF,V.FF,0.47,0.47,poleLF,V.kF,V.aF);ik(V.HB,V.FB,0.47,0.47,poleLB,V.kB,V.aB);
  seg(body.thighF,V.HF,V.kF);seg(body.shinF,V.kF,V.aF);seg(body.thighB,V.HB,V.kB);seg(body.shinB,V.kB,V.aB);
  body.kneeF.position.copy(V.kF);body.kneeB.position.copy(V.kB);
  body.shoeF.position.copy(V.aF).add(_a.set(0.05,-0.035,0));body.shoeB.position.copy(V.aB).add(_a.set(0.05,-0.035,0));
  body.pelvis.position.copy(V.H);
  V.Ch.copy(V.H).add(_a.set(0.1+0.22*c+(P.pushT>=0?0.08:0),0.52-0.1*c,0));
  seg(body.torso,_b.copy(V.H).add(_a.set(0,0.02,0)),V.Ch);
  const nk=_c.copy(V.Ch).add(_a.set(0.03,0.1,0));seg(body.neck,V.Ch,nk);
  body.head.position.copy(V.Ch).add(_a.set(0.05+0.04*c,0.22,-0.01));body.head.rotation.set(0,0,-0.15*c);
  V.SF.copy(V.Ch).add(_a.set(0,-0.05,-0.19));V.SB.copy(V.Ch).add(_a.set(0,-0.05,0.19));
  body.shoulderL.position.copy(V.SF);body.shoulderR.position.copy(V.SB);
  const out=0.35+(P.air?0.6:0)+Math.abs(P.lean)*1.2;
  V.hF.copy(V.SF).add(_a.set(0.14,-0.4+0.18*out,-0.1-0.24*out+sway));
  V.hB.copy(V.SB).add(_a.set(-0.02,-0.4+0.16*out,0.1+0.24*out-sway));
  ik(V.SF,V.hF,0.29,0.27,poleAF,V.eF,V.wF);ik(V.SB,V.hB,0.29,0.27,poleAB,V.eB,V.wB);
  seg(body.upF,V.SF,V.eF);seg(body.loF,V.eF,V.wF);seg(body.upB,V.SB,V.eB);seg(body.loB,V.eB,V.wB);
  body.handF.position.copy(V.wF);body.handB.position.copy(V.wB);
}

/* ---------- collisions / pickups ---------- */
let coinStreak=0,streakT=0;
function updateItems(dt){
  streakT-=dt;if(streakT<0)coinStreak=0;
  const cy=P.y+0.9;
  for(let i=0;i<TOK;i++){const t=tokens[i];
    if(t.active){
      if(t.z>P.z+15)t.active=false;
      else if(mode==='play'&&P.state==='ride'){const dx=t.x-P.x,dy=t.y-cy,dz=t.z-P.z;if(dx*dx+dy*dy+dz*dz<1.05){t.active=false;runTok++;AU.coin(coinStreak++);streakT=0.8;}}
    }
    if(t.active){dummy.position.set(t.x,t.y+Math.sin(time*2.5+i)*0.08,t.z);dummy.rotation.set(0,time*3+i,0);dummy.scale.set(1,1,1);
      tokGlowPos[i*3]=t.x;tokGlowPos[i*3+1]=dummy.position.y;tokGlowPos[i*3+2]=t.z;}
    else{dummy.position.set(0,-50,0);dummy.scale.set(0.001,0.001,0.001);tokGlowPos[i*3+1]=-50;}
    dummy.updateMatrix();tokMesh.setMatrixAt(i,dummy.matrix);
  }
  tokMesh.instanceMatrix.needsUpdate=true;tokGlow.geometry.attributes.position.needsUpdate=true;
  for(const c of cones){if(!c.active)continue;const m=c.m;
    if(c.hit){c.vy-=20*dt;m.position.x+=c.vx*dt;m.position.y=Math.max(0,m.position.y+c.vy*dt);m.position.z+=c.vz*dt;m.rotation.x+=dt*9;m.rotation.z+=dt*5;}
    else if(P.state==='ride'){const dx=Math.abs(m.position.x-P.x),dz=Math.abs(m.position.z-P.z);
      if(dx<0.42&&dz<0.38){if(P.y<0.55){c.hit=true;c.vx=(m.position.x-P.x)*6+rand(-2,2);c.vy=5;c.vz=-P.v*0.9;AU.bonk();if(mode==='play'){P.v*=0.72;pop('Bonk');}}}
      else if(!c.cleared&&dx<0.6&&m.position.z>P.z+0.4&&P.air){c.cleared=true;if(mode==='play'){runTok++;pop('Clean ollie','+1 token');AU.trick();}}}
    if(m.position.z>P.z+20){c.active=false;m.visible=false;}}
  if(mode==='play'&&P.state==='ride'&&P.inv<=0){for(const c of cars){if(!c.active)continue;if(Math.abs(c.x-P.x)<1.18&&Math.abs(c.z-P.z)<2.7){crash();break;}}}
}

/* ---------- world rebase (keeps float precision on endless runs) ---------- */
const SHIFT=3200;
function rebase(){
  P.z+=SHIFT;spawnZ+=SHIFT;camera.position.z+=SHIFT;camLook.z+=SHIFT;
  strips.forEach(s=>s.shift(SHIFT));cars.forEach(c=>c.z+=SHIFT);cones.forEach(c=>c.m.position.z+=SHIFT);tokens.forEach(t=>t.z+=SHIFT);
}

/* ---------- camera ---------- */
const camLook=new V3(0,0.5,-18);
let shake=0;
function updateCamera(dt){
  const portrait=innerHeight>innerWidth;
  const k=1-Math.exp(-3*dt);
  const tx=P.x*0.55+Math.sin(time*0.31)*0.35, ty=(portrait?10.5:8.2)+P.y*0.25+Math.sin(time*0.23)*0.15;
  camera.position.x=lerp(camera.position.x,tx,k);camera.position.y=lerp(camera.position.y,ty,k);camera.position.z=P.z+(portrait?14:12);
  camLook.set(lerp(camLook.x,P.x*0.75,k),0,P.z-(portrait?21:24));
  camera.lookAt(camLook);
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*0.6;camera.position.y+=(Math.random()-.5)*shake*0.6;}
}
const sunScreen=new V3();
function updateGlare(){
  sunScreen.copy(SUN).multiplyScalar(1000).add(camera.position).project(camera);
  const el=$('glare');
  if(sunScreen.z<1&&Math.abs(sunScreen.x)<1.4&&Math.abs(sunScreen.y)<1.4){el.style.left=((sunScreen.x+1)/2*100)+'%';el.style.top=((1-sunScreen.y)/2*100)+'%';el.style.opacity=1;}
  else el.style.opacity=0;
}

/* ---------- flow ---------- */
function startRun(){
  AU.init();
  $('title').classList.remove('on');$('over').classList.remove('on');$('hud').classList.add('on');
  resetRider();
  runDist=0;runTok=0;P.v=Math.max(P.v,8);P.inv=2.5;P.tx=0;P.brake=0;
  cars.forEach(c=>{if(c.active&&Math.abs(c.z-P.z)<120){c.active=false;c.g.visible=false;c.wait=rand(1,4);}});
  tokens.forEach(t=>t.active=false);cones.forEach(c=>{c.active=false;c.m.visible=false;});
  spawnZ=P.z-45;mode='play';captionIdx=0;nextCaption=500;
  setTimeout(()=>{if(mode==='play')caption(CAPTIONS[0]);},500);
  canvas.focus({preventScroll:true});
}
function gameOver(){
  mode='over';
  const isBest=runDist>best;if(isBest){best=runDist;store.set('sundown-best',String(Math.floor(best)));}
  $('overTitle').textContent=isBest&&runDist>50?'New best':'Wiped out';
  $('oDist').textContent=fmt(runDist);$('oTok').textContent=runTok;$('oBest').textContent=fmt(best);$('best').textContent=fmt(best);
  $('over').classList.add('on');$('hud').classList.remove('on');
  setTimeout(()=>$('again').focus({preventScroll:true}),400);
}
$('play').addEventListener('click',e=>{e.stopPropagation();startRun();});
$('again').addEventListener('click',e=>{e.stopPropagation();startRun();});
$('mute').addEventListener('click',e=>{e.stopPropagation();AU.init();AU.setMute(!AU.muted);$('mute').textContent=AU.muted?'✕':'♪';});

/* ---------- input ---------- */
let ptr=null;
function isUI(t){return t&&t.closest&&t.closest('button');}
window.addEventListener('pointerdown',e=>{if(isUI(e.target))return;AU.init();if(mode!=='play')return;ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),moved:0};});
window.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.x;ptr.moved+=Math.abs(dx)+Math.abs(e.clientY-ptr.y);ptr.x=e.clientX;ptr.y=e.clientY;
  if(Math.abs(e.clientX-ptr.x0)>8){P.tx=clamp(P.tx+dx*(9/(Math.min(innerWidth,720)*0.8)),-3.9,3.9);}});
function endPtr(e){if(!ptr||e.pointerId!==ptr.id)return;const dt=performance.now()-ptr.t,dx=e.clientX-ptr.x0,dy=e.clientY-ptr.y0;
  if(dt<420&&dy<-40&&Math.abs(dy)>Math.abs(dx)*1.2)ollie(true);
  else if(dt<420&&dy>45&&Math.abs(dy)>Math.abs(dx)*1.2)P.brake=1.4;
  else if(dt<300&&ptr.moved<14)ollie(false);
  ptr=null;}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',e=>{ptr=null;});
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(keys[k]&&k!==' ')return;keys[k]=true;
  if(k==='m'){AU.init();AU.setMute(!AU.muted);$('mute').textContent=AU.muted?'✕':'♪';return;}
  if(mode==='title'||mode==='over'){if(k==='enter'||(k===' '&&!isUI(document.activeElement))){e.preventDefault();startRun();}return;}
  if(mode!=='play')return;
  if(k===' '){e.preventDefault();ollie(false);}
  if(k==='w'||k==='arrowup'){e.preventDefault();ollie(true);}
  updSteer();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;updSteer();});
function updSteer(){steerKey=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);brakeKey=!!(keys['s']||keys['arrowdown']);}
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;updSteer();});
let paused=false;
document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(AU.ctx){paused?AU.ctx.suspend():AU.ctx.resume();}});

/* ---------- resize ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:52;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

/* ---------- main loop ---------- */
resetRider();
camera.position.set(0,10.5,14);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;if(paused)return;
  time+=dt;P.inv-=dt;
  if(mode==='play'||mode==='title'||mode==='crash'||mode==='over'){
    if(mode!=='over')updatePlayer(dt);else{P.v=Math.max(0,P.v-6*dt);P.z-=P.v*dt;root.position.z=P.z;}
  }
  if(mode==='play')spawnPatterns();
  updateCars(dt);updateItems(dt);
  for(const s of strips)s.update(P.z);
  for(const f of followers){f.mesh.position.z=P.z+f.zOff;if(f.tex){const L=f.len,p=f.period;let o=-(0.5*L/p+f.mesh.position.z/p);f.tex.offset.y=o-Math.floor(o);}}
  ocean.position.set(0,-0.35,P.z-COAST-1600+10);beach.position.set(0,0.04,P.z-COAST+2);
  placeSun(P.z);
  updateCamera(dt);
  sky.position.copy(camera.position);
  sky.material.uniforms.time.value=time;oceanMat.uniforms.time.value=time;
  for(let i=0;i<MOTES;i++){let z=motePos[i*3+2];const wz=camera.position.z+z;
    motePos[i*3]+=Math.sin(time*0.4+moteSeed[i])*0.004;motePos[i*3+1]+=Math.cos(time*0.3+moteSeed[i])*0.003;}
  motes.position.set(camera.position.x,0,camera.position.z);motes.geometry.attributes.position.needsUpdate=true;
  updateGlare();
  if(mode==='play'){
    $('dist').textContent=runDist<1000?Math.floor(runDist):(runDist/1000).toFixed(2);$('unit').textContent=runDist<1000?'m':'km';
    $('tok').textContent=runTok;
    if(runDist>nextCaption){captionIdx=(captionIdx+1)%CAPTIONS.length;caption(CAPTIONS[captionIdx]);nextCaption+=600;}
  }
  if(capTimer>0){capTimer-=dt;if(capTimer<=0)$('caption').classList.remove('on');}
  if(popTimer>0){popTimer-=dt;if(popTimer<=0)$('pop').classList.remove('on');}
  if(P.z<-SHIFT)rebase();
  AU.tick();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
